.emp{font-size:13px;color:#aaa;padding:20px 0}

<script>
const M=[
  {n:"Gluteus maximus",r:"g",rl:"Gluteal region",nk:"ng",nl:"Inferior gluteal (L5–S2)",
   a:[{l:"Hip extension",c:"te"},{l:"Lateral rotation",c:"tr"},{l:"Abduction (upper fibres)",c:"ta"}],
   o:"Posterior ilium (posterior gluteal line), sacrum, coccyx, sacrotuberous ligament",
   i:"Iliotibial tract + gluteal tuberosity of femur",
   cl:"Largest muscle in the body. Primary hip extensor. Most active in stair climbing, rising from sitting, running. ITB tightness related to ITBS and piriformis syndrome."},
  {n:"Gluteus medius",r:"g",rl:"Gluteal region",nk:"ng",nl:"Superior gluteal (L4–S1)",
   a:[{l:"Hip abduction",c:"ta"},{l:"Medial rotation (anterior fibres)",c:"tr"},{l:"Pelvic stabilisation",c:"ts"}],
   o:"Ilium between anterior and posterior gluteal lines",
   i:"Greater trochanter of femur (lateral surface)",
   cl:"Weakness → Trendelenburg gait (pelvis drops to opposite side during stance). Key IM injection site. Essential pelvic stabiliser."},
  {n:"Gluteus minimus",r:"g",rl:"Gluteal region",nk:"ng",nl:"Superior gluteal (L4–S1)",
   a:[{l:"Hip abduction",c:"ta"},{l:"Medial rotation",c:"tr"},{l:"Pelvic stabilisation",c:"ts"}],
   o:"Ilium between anterior and inferior gluteal lines",
   i:"Greater trochanter (anterior surface)",
   cl:"Deepest and smallest gluteal muscle. Works synergistically with medius. Paralysis also causes Trendelenburg sign."},
  {n:"Piriformis",r:"g",rl:"Gluteal region",nk:"ns",nl:"Direct branches S1–S2",
   a:[{l:"Lateral rotation (hip extended)",c:"tr"},{l:"Abduction (hip flexed)",c:"ta"}],
   o:"Anterior surface of sacrum (S2–S4), sacrotuberous ligament",
   i:"Greater trochanter (superior surface)",
   cl:"Sciatic nerve passes inferior to it in most people. Piriformis syndrome: sciatic pain from spasm. Key landmark for inferior gluteal vessels and nerve."},
  {n:"Obturator internus",r:"g",rl:"Gluteal region",nk:"ns",nl:"Nerve to obturator internus (L5–S2)",
   a:[{l:"Lateral rotation",c:"tr"},{l:"Abduction (hip flexed)",c:"ta"}],
   o:"Inner surface of obturator membrane + surrounding pelvic bone",
   i:"Greater trochanter (medial surface)",
   cl:"Exits pelvis via lesser sciatic foramen, hooks around ischium — gives it a unique line of pull. Part of short external rotators."},
  {n:"Gemellus superior",r:"g",rl:"Gluteal region",nk:"ns",nl:"Nerve to obturator internus (L5–S2)",
   a:[{l:"Lateral rotation",c:"tr"}],
   o:"Ischial spine",i:"Greater trochanter (blends with obturator internus tendon)",
   cl:"Upper helper of obturator internus. Part of the short external rotator group. Rarely tested independently."},
  {n:"Gemellus inferior",r:"g",rl:"Gluteal region",nk:"ns",nl:"Nerve to quadratus femoris (L4–S1)",
   a:[{l:"Lateral rotation",c:"tr"}],
   o:"Ischial tuberosity",i:"Greater trochanter (blends with obturator internus tendon)",
   cl:"Lower helper of obturator internus. Below the tendon. Part of short external rotators."},
  {n:"Quadratus femoris",r:"g",rl:"Gluteal region",nk:"ns",nl:"Nerve to quadratus femoris (L4–S1)",
   a:[{l:"Lateral rotation",c:"tr"},{l:"Hip adduction (weak)",c:"tad"}],
   o:"Lateral border of ischial tuberosity",i:"Intertrochanteric crest of femur",
   cl:"Strongest short external rotator. Ischiofemoral impingement can compress it between ischium and lesser trochanter."},
  {n:"Tensor fasciae latae",r:"g",rl:"Gluteal region",nk:"ng",nl:"Superior gluteal (L4–S1)",
   a:[{l:"Hip abduction",c:"ta"},{l:"Hip flexion",c:"tf"},{l:"Medial rotation",c:"tr"},{l:"Knee stabilisation via ITB",c:"ts"}],
   o:"Anterior superior iliac spine (ASIS) + anterior iliac crest",
   i:"Iliotibial band (ITB) → Gerdy's tubercle of tibia",
   cl:"ITB tightness → iliotibial band syndrome (lateral knee pain in runners). Acts via the ITB to stabilise the knee."},
  {n:"Iliacus",r:"ta",rl:"Anterior thigh",nk:"nf",nl:"Femoral nerve (L2–L4)",
   a:[{l:"Hip flexion",c:"tf"},{l:"Lateral rotation (weak)",c:"tr"}],
   o:"Iliac fossa, iliac crest, anterior sacroiliac ligaments",
   i:"Lesser trochanter of femur (with psoas major tendon)",
   cl:"Forms iliopsoas with psoas major. Innervated by femoral nerve proximal to inguinal ligament. TB psoas abscess can track here."},
  {n:"Psoas major",r:"ta",rl:"Anterior thigh",nk:"nf",nl:"Lumbar plexus direct (L1–L3)",
   a:[{l:"Hip flexion",c:"tf"},{l:"Lumbar spine flexion (bilateral)",c:"tf"},{l:"Lateral rotation",c:"tr"}],
   o:"Transverse processes + vertebral bodies/discs T12–L5",
   i:"Lesser trochanter of femur",
   cl:"Tight psoas → anterior pelvic tilt, hyperlordosis, low back pain. Psoas abscess (TB, Crohn's) tracks down to femoral triangle presenting as groin swelling."},
  {n:"Rectus femoris",r:"ta",rl:"Anterior thigh",nk:"nf",nl:"Femoral nerve (L2–L4)",
   a:[{l:"Knee extension",c:"te"},{l:"Hip flexion",c:"tf"}],
   o:"Anterior inferior iliac spine (AIIS) + groove above acetabulum",
   i:"Patella → patellar tendon → tibial tuberosity",
   cl:"Only quadriceps head crossing the hip — hence its two actions. Quad strain in kicking sports. AIIS avulsion fractures in adolescent athletes."},
  {n:"Vastus lateralis",r:"ta",rl:"Anterior thigh",nk:"nf",nl:"Femoral nerve (L2–L4)",
   a:[{l:"Knee extension",c:"te"}],
   o:"Intertrochanteric line, greater trochanter, lateral linea aspera, lateral intermuscular septum",
   i:"Lateral patella → patellar tendon → tibial tuberosity",
   cl:"Largest quadriceps head. IM injection site in infants (no major vessels). Lateral retinaculum tightness → lateral patellar tracking disorder."},
  {n:"Vastus medialis",r:"ta",rl:"Anterior thigh",nk:"nf",nl:"Femoral nerve (L2–L4)",
   a:[{l:"Knee extension",c:"te"},{l:"Medial patellar stabilisation",c:"ts"}],
   o:"Intertrochanteric line, medial linea aspera, medial supracondylar line, adductor magnus tendon",

  {n:"Vastus intermedius",r:"ta",rl:"Anterior thigh",nk:"nf",nl:"Femoral nerve (L2–L4)",
   a:[{l:"Knee extension",c:"te"}],
   o:"Anterior and lateral femoral shaft (upper 2/3)",

  {n:"Sartorius",r:"ta",rl:"Anterior thigh",nk:"nf",nl:"Femoral nerve (L2–L3)",
   a:[{l:"Hip flexion",c:"tf"},{l:"Hip abduction + lateral rotation",c:"ta"},{l:"Knee flexion",c:"tf"}],
   o:"Anterior superior iliac spine (ASIS)",
   i:"Pes anserinus (medial surface of tibia, with gracilis and semitendinosus)",
   cl:"Longest muscle in the body. 'Tailor's muscle.' Forms lateral border of femoral triangle. Part of pes anserinus (important in pes anserinus bursitis)."},
  {n:"Pectineus",r:"ta",rl:"Anterior thigh",nk:"nf",nl:"Femoral (L2–L3) ± Obturator",

   o:"Pectineal line of pubis (between iliopectineal eminence and pubic tubercle)",

  {n:"Adductor longus",r:"tm",rl:"Medial thigh",nk:"no",nl:"Obturator nerve (L2–L4)",
   a:[{l:"Hip adduction",c:"tad"},{l:"Hip flexion (from extended position)",c:"tf"}],
   o:"Body of pubis below the pubic tubercle",
   i:"Middle third of linea aspera of femur",
   cl:"Most commonly strained adductor ('groin strain'). Forms medial border of femoral triangle. Most anteriorly placed adductor."},
  {n:"Adductor brevis",r:"tm",rl:"Medial thigh",nk:"no",nl:"Obturator nerve (L2–L4)",
   a:[{l:"Hip adduction",c:"tad"},{l:"Hip flexion",c:"tf"}],

   i:"Pectineal line + upper third of linea aspera",

  {n:"Adductor magnus",r:"tm",rl:"Medial thigh",nk:"no",nl:"Obturator (adductor) + Tibial division sciatic (hamstring part)",
   a:[{l:"Hip adduction",c:"tad"},{l:"Hip extension (hamstring/ischial part)",c:"te"}],
   o:"Inferior pubic ramus, ischial ramus (adductor part); ischial tuberosity (hamstring part)",
   i:"Linea aspera + medial supracondylar ridge; adductor tubercle (hamstring part)",

  {n:"Gracilis",r:"tm",rl:"Medial thigh",nk:"no",nl:"Obturator nerve (L2–L3)",
   a:[{l:"Hip adduction",c:"tad"},{l:"Knee flexion",c:"tf"},{l:"Medial rotation of flexed leg",c:"tr"}],
   o:"Body and inferior ramus of pubis",
   i:"Pes anserinus (medial tibia, with sartorius and semitendinosus)",

  {n:"Obturator externus",r:"tm",rl:"Medial thigh",nk:"no",nl:"Obturator nerve (L3–L4)",
   a:[{l:"Lateral rotation of hip",c:"tr"},{l:"Hip joint stabilisation",c:"ts"}],
   o:"Outer surface of obturator membrane + margins of obturator foramen",
   i:"Trochanteric fossa of femur",
   cl:"Deep external rotator. Sometimes grouped with short external rotators of the gluteal region. Obturator nerve passes superior to it."},
  {n:"Biceps femoris — long head",r:"tp",rl:"Posterior thigh",nk:"ns",nl:"Tibial division of sciatic (S1–S3)",
   a:[{l:"Knee flexion",c:"tf"},{l:"Hip extension",c:"te"},{l:"Lateral rotation of leg (knee flexed)",c:"tr"}],
   o:"Ischial tuberosity (shared origin with semitendinosus)",

   cl:"Most commonly strained hamstring. Proximal hamstring avulsion at ischial tuberosity occurs in sprinting ('water-skier injury'). Common peroneal nerve at its medial border."},
  {n:"Biceps femoris — short head",r:"tp",rl:"Posterior thigh",nk:"np",nl:"Common peroneal division of sciatic (L5–S2)",
   a:[{l:"Knee flexion",c:"tf"},{l:"Lateral rotation of leg",c:"tr"}],
   o:"Lateral linea aspera + lateral supracondylar line of femur",

  {n:"Semitendinosus",r:"tp",rl:"Posterior thigh",nk:"ns",nl:"Tibial division of sciatic (L5–S2)",
   a:[{l:"Knee flexion",c:"tf"},{l:"Hip extension",c:"te"},{l:"Medial rotation of leg",c:"tr"}],
   o:"Ischial tuberosity (with long head of biceps femoris)",
   i:"Pes anserinus (medial tibia, with sartorius and gracilis)",

  {n:"Semimembranosus",r:"tp",rl:"Posterior thigh",nk:"ns",nl:"Tibial division of sciatic (L5–S2)",
   a:[{l:"Knee flexion",c:"tf"},{l:"Hip extension",c:"te"},{l:"Medial rotation of leg",c:"tr"}],
   o:"Ischial tuberosity (superolateral impression)",

  {n:"Popliteus",r:"tp",rl:"Posterior thigh",nk:"nt",nl:"Tibial nerve (L4–S1)",

  {n:"Tibialis anterior",r:"la",rl:"Anterior leg",nk:"np",nl:"Deep peroneal nerve (L4–L5)",
   a:[{l:"Dorsiflexion",c:"tp"},{l:"Inversion",c:"to"}],

  {n:"Extensor hallucis longus",r:"la",rl:"Anterior leg",nk:"np",nl:"Deep peroneal nerve (L5–S1)",

  {n:"Extensor digitorum longus",r:"la",rl:"Anterior leg",nk:"np",nl:"Deep peroneal nerve (L5–S1)",
   a:[{l:"Extension digits 2–5 (MTP and IP)",c:"te"},{l:"Dorsiflexion",c:"tp"},{l:"Eversion",c:"to"}],

  {n:"Peroneus (fibularis) tertius",r:"la",rl:"Anterior leg",nk:"np",nl:"Deep peroneal nerve (L5–S1)",

  {n:"Peroneus (fibularis) longus",r:"ll",rl:"Lateral leg",nk:"np",nl:"Superficial peroneal nerve (L5–S1)",

  {n:"Peroneus (fibularis) brevis",r:"ll",rl:"Lateral leg",nk:"np",nl:"Superficial peroneal nerve (L5–S1)",
   a:[{l:"Eversion",c:"to"},{l:"Plantarflexion (weak)",c:"tp"}],

  {n:"Gastrocnemius",r:"lp",rl:"Posterior leg — superficial",nk:"nt",nl:"Tibial nerve (S1–S2)",

  {n:"Soleus",r:"lp",rl:"Posterior leg — superficial",nk:"nt",nl:"Tibial nerve (S1–S2)",

   o:"Medial calcaneal tubercle + flexor retinaculum + plantar aponeurosis",
   i:"Medial base of proximal phalanx of great toe (with medial FHB tendon)",
   cl:"Forms the medial border of foot. Active in toe-off. Weakness associated with hallux valgus development. 1st layer of plantar muscles."},
  {n:"Flexor digitorum brevis",r:"f",rl:"Plantar foot — medial",nk:"nt",nl:"Medial plantar nerve (S1–S2)",
   a:[{l:"Flexion of PIP joints of digits 2–5",c:"tf"}],
   o:"Medial calcaneal tubercle + central plantar aponeurosis",
   i:"Middle phalanges of digits 2–5 (splits to allow FDL to pass through — mirror of FDS in hand)",
   cl:"Shares origin with plantar fascia — implicated in plantar fasciitis. 1st plantar layer."},
  {n:"Abductor digiti minimi (foot)",r:"f",rl:"Plantar foot — lateral",nk:"nt",nl:"Lateral plantar nerve (S1–S3)",
   a:[{l:"Little toe abduction",c:"ta"},{l:"Little toe MTP flexion",c:"tf"}],
   o:"Medial and lateral calcaneal tubercles + plantar aponeurosis",
   i:"Lateral base of proximal phalanx of little toe",
   cl:"Lateral plantar nerve entrapment (Baxter's nerve) causes lateral heel pain mimicking plantar fasciitis. 1st plantar layer."},
  {n:"Quadratus plantae",r:"f",rl:"Plantar foot — 2nd layer",nk:"nt",nl:"Lateral plantar nerve (S1–S2)",
   a:[{l:"Straightens oblique pull of FDL",c:"to"},{l:"Assists digit 2–5 flexion",c:"tf"}],
   o:"Medial and lateral heads of calcaneus (plantar surface)",
   i:"Posterolateral margin of FDL tendon before its division",
   cl:"Unique to humans — corrects the oblique pull of FDL so flexion is in line with toes. No direct hand equivalent. 2nd plantar layer."},
  {n:"Lumbricals (foot) ×4",r:"f",rl:"Plantar foot — 2nd layer",nk:"nt",nl:"Medial plantar (1st) + Lateral plantar (2nd–4th)",
   a:[{l:"MTP flexion + IP extension digits 2–5",c:"tf"}],
   o:"FDL tendons (from their medial sides)",
   i:"Medial extensor expansions of digits 2–5",
   cl:"Prevent claw toe deformity (by balancing MTP flexion with IP extension). Wasting causes claw toes in diabetic peripheral neuropathy. 2nd plantar layer."},
  {n:"Flexor hallucis brevis",r:"f",rl:"Plantar foot — medial",nk:"nt",nl:"Medial plantar nerve (S1–S2)",
   a:[{l:"Great toe MTP flexion",c:"tf"}],
   o:"Plantar surface of cuboid + adjacent lateral cuneiform",
   i:"Two heads → medial and lateral bases of proximal phalanx of great toe (sesamoid bones in tendons)",
   cl:"Contains two sesamoid bones. Sesamoiditis causes forefoot pain under 1st MTP joint. 3rd plantar layer."},
  {n:"Adductor hallucis",r:"f",rl:"Plantar foot — deep",nk:"nt",nl:"Lateral plantar nerve (S1–S2)",
   a:[{l:"Great toe adduction",c:"tad"},{l:"Transverse arch support",c:"ts"}],
   o:"Oblique head: bases of MT 2–4 + long plantar lig. Transverse head: deep transverse MT lig. + MTP joint capsules",
   i:"Lateral base of proximal phalanx of great toe (with lateral FHB tendon)",
   cl:"Weakness contributes to hallux valgus. Both heads support the transverse arch. 3rd plantar layer."},
  {n:"Flexor digiti minimi brevis (foot)",r:"f",rl:"Plantar foot — lateral",nk:"nt",nl:"Lateral plantar nerve (S1–S2)",
   a:[{l:"Little toe MTP flexion",c:"tf"}],
   o:"Base of 5th metatarsal + long plantar ligament",
   i:"Lateral base of proximal phalanx of little toe",
   cl:"Small muscle. 3rd plantar layer. May become hypertrophied contributing to little toe corn."},
  {n:"Plantar interossei ×3",r:"f",rl:"Plantar foot — deep",nk:"nt",nl:"Lateral plantar nerve (S1–S2)",
   a:[{l:"Adduction of digits 3–5 toward 2nd toe",c:"tad"},{l:"MTP flexion",c:"tf"}],
   o:"Medial bases and shafts of metatarsals 3–5 (unipennate — one origin each)",
   i:"Medial sides of extensor expansions of digits 3–5",
   cl:"Mnemonic: 'PAD' — Plantar ADduct. Axis of foot is 2nd toe. Wasted in peripheral neuropathy causing forefoot deformity. 4th plantar layer."},
  {n:"Dorsal interossei (foot) ×4",r:"f",rl:"Plantar foot — deep",nk:"nt",nl:"Lateral plantar nerve (S1–S2)",
   a:[{l:"Abduction of digits 2–4 away from 2nd toe",c:"ta"},{l:"MTP flexion",c:"tf"}],
   o:"Adjacent metatarsal shafts (bipennate — two origins each)",
   i:"Extensor expansions of digits 2–4 (1st to medial side of 2nd toe; 2nd–4th to lateral sides)",
   cl:"Mnemonic: 'DAB' — Dorsal ABduct. Axis = 2nd toe (not 3rd as in hand). Atrophy → metatarsalgia and splaying. 4th plantar layer."}
];

const ORDER=["g","ta","tm","tp","la","ll","lp","f"];
const LABELS={g:"Gluteal region",ta:"Anterior thigh",tm:"Medial thigh",tp:"Posterior thigh",la:"Anterior leg",ll:"Lateral leg",lp:"Posterior leg",f:"Foot (intrinsic)"};
const NKEYS=["nf","no","ns","nt","np","ng"];

let view='all',sel=null;

function sv(v,el){
  view=v;sel=null;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  render();
  document.getElementById('det').innerHTML='<p class="emp">Click any muscle card to see origin, insertion, nerve supply, and clinical notes.</p>';
}

function fl(){
  if(view==='all') return M;
  if(NKEYS.includes(view)) return M.filter(m=>m.nk===view);
  return M.filter(m=>m.r===view);
}

function render(){
  const list=fl();
  const byR={};
  list.forEach(m=>{if(!byR[m.r])byR[m.r]=[];byR[m.r].push(m);});
  const keys=ORDER.filter(k=>byR[k]);
  let h=`<div style="font-size:12px;color:#aaa;margin-bottom:12px">${list.length} muscle${list.length!==1?'s':''} shown</div>`;
  keys.forEach(k=>{
    h+=`<div class="slbl">${LABELS[k]} <span class="count">(${byR[k].length})</span></div><div class="grid">`;
    byR[k].forEach(m=>{
      const i=M.indexOf(m);
      const s=sel===i?' sel':'';
      const tags=m.a.map(a=>`<span class="tag ${a.c}">${a.l}</span>`).join('');
      h+=`<div class="card${s}" onclick="pick(${i})"><div class="cn">${m.n}</div><div class="cg">${m.nl}</div><div class="tags">${tags}</div></div>`;
    });
    h+='</div>';
  });
  document.getElementById('main').innerHTML=h;
}

function pick(i){
  sel=i;render();
  const m=M[i];
  const tags=m.a.map(a=>`<span class="tag ${a.c}">${a.l}</span>`).join('');
  document.getElementById('det').innerHTML=`
    <div class="dt">${m.n}</div>
    <div class="ds">${m.rl} &nbsp;·&nbsp; ${m.nl}</div>
    <div class="tags" style="margin-bottom:12px">${tags}</div>
    <div class="dg">
      <div class="dc"><label>Origin</label><p>${m.o}</p></div>
      <div class="dc"><label>Insertion</label><p>${m.i}</p></div>
      <div class="dc"><label>Nerve supply</label><p>${m.nl}</p></div>
      <div class="dc"><label>Clinical note</label><p>${m.cl}</p></div>
    </div>`;
}
render();
</script>
