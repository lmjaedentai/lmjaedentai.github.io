<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Base Converter</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #fff;
    color: #0a0a0a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #1a56db;
    margin-bottom: 32px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
    border-bottom: 1px solid #e8e8e8;
    gap: 16px;
  }

  .row-label {
    font-size: 20px;
    font-weight: 600;
    color: #555;
    white-space: nowrap;
    min-width: 80px;
  }

  input[type=text] {
    flex: 1;
    font-size: 32px;
    font-weight: 800;
    color: #0a0a0a;
    border: none;
    outline: none;
    text-align: right;
    background: transparent;
    min-width: 0;
  }
  input[type=text]::placeholder { color: #d0d0d0; }
  input[type=text]:focus { color: #1a56db; }
  input[type=text].error { color: #dc2626; }

  .unit {
    font-size: 14px;
    font-weight: 700;
    color: #aaa;
    width: 40px;
    text-align: left;
    letter-spacing: 0.04em;
  }

  .error-msg {
    font-size: 13px;
    color: #dc2626;
    text-align: right;
    padding-top: 6px;
    min-height: 18px;
  }

  .clear-btn {
    display: block;
    margin: 24px auto 0;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 600;
    color: #999;
    background: #f5f5f5;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .clear-btn:hover { background: #ececec; color: #666; }
</style>
</head>
<body>
<div class="container">

  <h1>Number Base Converter</h1>

  <!-- Decimal -->
  <div class="row">
    <span class="row-label">Decimal</span>
    <input type="text" id="dec" placeholder="42" oninput="onEdit('dec')">
    <span class="unit">DEC</span>
  </div>

  <!-- Binary -->
  <div class="row">
    <span class="row-label">Binary</span>
    <input type="text" id="bin" placeholder="101010" oninput="onEdit('bin')">
    <span class="unit">BIN</span>
  </div>

  <!-- Octal -->
  <div class="row">
    <span class="row-label">Octal</span>
    <input type="text" id="oct" placeholder="52" oninput="onEdit('oct')">
    <span class="unit">OCT</span>
  </div>

  <!-- Hex -->
  <div class="row">
    <span class="row-label">Hex</span>
    <input type="text" id="hex" placeholder="2A" oninput="onEdit('hex')">
    <span class="unit">HEX</span>
  </div>

  <div class="error-msg" id="err"></div>

  <button class="clear-btn" onclick="clearAll()">Clear</button>

</div>

<script>
  const fields = {
    dec: { el: null, base: 10, valid: /^[0-9]+$/ },
    bin: { el: null, base: 2,  valid: /^[01]+$/ },
    oct: { el: null, base: 8,  valid: /^[0-7]+$/ },
    hex: { el: null, base: 16, valid: /^[0-9a-fA-F]+$/ }
  };

  for (const key in fields) {
    fields[key].el = document.getElementById(key);
  }
  const errEl = document.getElementById('err');

  function onEdit(sourceKey) {
    const source = fields[sourceKey];
    const raw = source.el.value.trim();

    // clear error state
    for (const k in fields) fields[k].el.classList.remove('error');
    errEl.textContent = '';

    if (raw === '') {
      for (const k in fields) {
        if (k !== sourceKey) fields[k].el.value = '';
      }
      return;
    }

    if (!source.valid.test(raw)) {
      source.el.classList.add('error');
      errEl.textContent = 'Invalid digit for ' + sourceKey.toUpperCase();
      return;
    }

    let value;
    try {
      value = BigInt(source.base === 10 ? raw : parseIntBig(raw, source.base));
    } catch (e) {
      source.el.classList.add('error');
      errEl.textContent = 'Number too large or invalid';
      return;
    }

    for (const k in fields) {
      if (k === sourceKey) continue;
      fields[k].el.value = toBase(value, fields[k].base);
    }
  }

  // Convert an arbitrary-base string to a BigInt
  function parseIntBig(str, base) {
    let result = 0n;
    const b = BigInt(base);
    for (const ch of str.toLowerCase()) {
      const d = parseInt(ch, 36);
      result = result * b + BigInt(d);
    }
    return result;
  }

  function toBase(value, base) {
    if (value === 0n) return '0';
    const digits = '0123456789ABCDEF';
    let n = value;
    let out = '';
    const b = BigInt(base);
    while (n > 0n) {
      out = digits[Number(n % b)] + out;
      n = n / b;
    }
    return out;
  }

  function clearAll() {
    for (const k in fields) {
      fields[k].el.value = '';
      fields[k].el.classList.remove('error');
    }
    errEl.textContent = '';
  }
</script>
</body>
</html>
