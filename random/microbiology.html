# Medical Microbiology

## Bacteria

### Classification by Gram Stain

#### Gram Positive Cocci

##### Staphylococcus aureus
- **Tests**
  - Catalase positive
  - Coagulase positive
  - Beta-hemolysis
  - Yellow colonies
- **Colonization**
  - Nasal mucosa
  - Skin
  - Vagina (30% population)
- **Transmission**
  - Direct contact
  - Fomites
  - Droplets
  - Contaminated food
- **Virulence**
  - Exfoliative toxins
  - Hemolysin
  - Alpha toxin
  - TSST-1
  - Coagulase
- **Clinical**
  - Pyogenic infections (abscess, cellulitis, endocarditis, osteomyelitis, pneumonia)
  - Toxin-mediated (food poisoning, toxic shock, scalded skin)
- **Risk**
  - Hospitalization
  - Surgery
  - Catheters
  - Immunocompromised
  - IVDU
  - Chronic carriers
- **Management**
  - MSSA (Cloxacillin, beta-lactams)
  - MRSA (Vancomycin, daptomycin, linezolid)
  - Incision and drainage
- **Prevention**
  - Hand hygiene
  - Cover infections
  - Equipment disinfection

##### Streptococcus pyogenes (Group A Strep)
- **Tests**
  - Catalase negative
  - Beta-hemolysis
  - Bacitracin sensitive
  - Lancefield Group A
    - contains group A antigen => agglutination
- **Colonization**: Upper respiratory tract (3-5% adults, 10% children)
- **Transmission**: Droplet
- **Virulence**
  - M protein (antiphagocytic)
  - Streptolysin O and S
  - Pyrogenic exotoxins
  - Streptokinase
- **Clinical**
  - Pyogenic (pharyngitis, tonsillitis, impetigo, erysipelas, necrotizing fasciitis)
  - Toxin-mediated (scarlet fever, toxic shock)
  - Post-infectious (glomerulonephritis, rheumatic fever)
- **Risk**: Immunologic disease occurs weeks after infection
- **Management**
  - Penicillin G
  - Amoxicillin
  - Alternatives (erythromycin, clindamycin)
- **Prevention**
  - Hand hygiene
  - Prompt pharyngitis treatment

##### Streptococcus pneumoniae
- **Tests**
  - Catalase negative
  - Alpha-hemolysis
  - Optochin sensitive
  - Bile solubility positive
  - Lancet-shaped diplococci
- **Colonization**: Nasopharynx (5-10% adults, 20-40% children)
- **Transmission**
  - Droplets
  - Close contact
  - Aspiration
- **Virulence**
  - Capsular polysaccharides (antiphagocytic)
  - Pneumolysin
  - PsaA
  - PspA
  - PspC
- **Clinical**
  - Pneumonia
  - Meningitis
  - Otitis media
  - Sinusitis
  - Endocarditis
- **Risk**
  - Depressed cough reflex
  - Alcohol intoxication
  - Prior viral infection
  - Splenectomy
  - Sickle cell
- **Management**
  - Penicillin G
  - Ceftriaxone
  - Vancomycin
  - Levofloxacin
- **Prevention**: Vaccination

##### Streptococcus agalactiae (Group B Strep)
- **Tests**
  - Catalase negative
  - Beta-hemolysis (small zone)
  - Lancefield Group B
- **Colonization**
  - Female genital tract (5-30%)
  - GI tract
- **Transmission**
  - Vertical (childbirth)
  - Direct contact
- **Virulence**: Polysaccharide capsule (antiphagocytic)
- **Clinical**
  - Neonatal meningitis
  - Neonatal sepsis
  - Maternal UTI
  - Chorioamnionitis
- **Risk**
  - Prolonged rupture membranes (>18hr)
    - neonatal meningitis/sepsis
    - due to GBS colonization in vagina
  - Premature delivery (<37 weeks)
- **Management**
  - Penicillin G
  - Amoxicillin
  - May need aminoglycosides
- **Prevention**
  - Antibiotic prophylaxis (Penicillin G, ampicillin)
  - Vaginal swab screening

#### Gram Positive Rods

##### Corynebacterium diphtheriae
- **Tests**
  - Club-shaped GPR
  - Non-spore forming
  - PCR for toxin genes
- **Colonization**
  - Skin
  - Upper respiratory tract
  - GI tract
- **Transmission**
  - Droplets
  - Direct contact with skin lesions
- **Virulence**
  - Diphtheria toxin (inhibits protein synthesis)
  - Pseudomembrane formation
- **Clinical**
  - Respiratory diphtheria (pseudomembrane, airway obstruction)
    - covering mucous lining of...
      - tonsil
      - pharynx
      - larynx
      - nares
  - Cutaneous diphtheria (rash, ulcers)
- **Risk**: Unimmunized individuals
- **Management**
  - Anti-toxin (immediate)
  - Antibiotics (erythromycin, penicillin)
  - Airway protection
- **Prevention**: DTaP vaccination (toxoid)

##### Clostridium botulinum
- **Tests**
  - Anaerobic
  - Spore-forming
  - GPR
- **Colonization**
  - Soil
  - Intestinal tract of humans and animals
- **Transmission**
  - Ingestion of preformed toxins
  - Ingestion of spores
  - Wound contamination
- **Virulence**
  - **Botulinum toxin**: Life threatening neuroparalytic disease (blocks ACh release)
    - protease inhibit muscle stimulation
  - Flaccid paralysis
- **Clinical**
  - Food botulism (GI symptoms, paralysis)
  - Infant botulism (floppy baby)
    - hypotonia
    - irritability
    - weak cry
    - feeding difficulty
  - Wound botulism
    - injection drug user: wound contamination with clostridium spore
    - neurological syndrome
    - muscle weakness & paralysis
  - Respiratory failure
- **Risk**
  - Improperly canned food
  - Honey (infants)
  - IVDU with wounds
- **Management**
  - Supportive care
  - Airway management
- **Prevention**
  - Proper food handling
  - Adequate heating
  - Avoid honey in infants

##### Clostridium tetani
- **Tests**
  - Anaerobic
  - Spore-forming
  - GPR
  - Heat-resistant endospores
- **Colonization**
  - Soil
  - Intestinal tract
- **Transmission**
  - Spores through contaminated wounds
    - rare: widespread vaccination
  - postsurgical tetanus
    - inadequate sterilization of surgical instrument
    - endospore resisant to high temp
    - wound infection
- **Virulence**
  - tetanus toxin (block inhibitory neurotransmitters)
    - Tetanospasmin
    - Tetanolysin 
  - Spastic paralysis
- **Clinical**
  - Tetanus
  - Sustained muscle contraction
  - Opisthotonus (arching back)
  - Respiratory failure
- **Risk**
  - Puncture wounds
  - Foreign body
  - Unimmunized
- **Management**
  - Passive immunization (tetanus immunoglobulin)
  - Toxoid vaccines
  - Supportive care
- **Prevention**: Anti-tetanus vaccination

##### Clostridium perfringens
- **Tests**
  - Anaerobic
  - Spore-forming
  - GPR
- **Colonization**
  - Soil
  - Intestinal tract
- **Transmission**: Spores contaminating wounds or food
- **Virulence**
  - Alpha toxin (lecithinase, hemolytic)
    - degrade tissue & cell membrane
    - causes small vessel thrombosis & tissue ischemia
  - Enterotoxin: disrupt ion transport in ileum => watery diarrhea
  - Hyaluronidase
  - Collagenase
- **Clinical**
  - Gas gangrene (necrotizing infection, gas production, rapid)
    - anaerobic organism: fermentation of carbohydrates produce massive amount of gas in tissue
    - pressure restriction of blood supply => tissue necrosis
    - rapid progressive & fatal
  - Food poisoning 
  - Hemorrhagic diarrhea
- **Risk**
  - Wound contamination
  - Improperly stored food
- **Management**
  - Metronidazole
  - Surgical debridement
  - Supportive care
- **Prevention**
  - Proper food handling
  - Adequate heating

##### Clostridium difficile
- **Tests**
  - Anaerobic
  - Spore-forming
  - GPR
  - Spores alcohol-resistant
- **Colonization**: GI tract (3% healthy adults, 8-10% hospitalized)
- **Transmission**
  - Fecal-oral via endospores
  - Person-to-person
- **Virulence**
  - normal gut flora eliminated <= antibiotic use
  - but it more resistant => dominate
  - Enterotoxin A (alters fluid secretion)
  - Enterotoxin B (disrupts cytoskeleton)
  - Spores resist alcohol
- **Clinical**
  - Antibiotic-associated diarrhea
  - Pseudomembranous colitis
  - Watery diarrhea
  - Abdominal pain
- **Risk**
  - Antibiotic use (clindamycin, ampicillin, cephalosporins)
  - Elimination of normal flora
  - Hospitalization
- **Management**
  - antibiotic coverage anaerobes (metronidazole, vancomycin, fidaxomicin)
  - Surgical intervention: wound debridement, wound care
- **Prevention**
  - Avoid inappropriate antibiotics
  - Hand washing with soap (NOT alcohol)
  - Environmental disinfection

#### Gram Negative Rods (Enterobacteriaceae)

##### Escherichia coli
- **Tests**
  - Straight GNR
  - Facultative anaerobe
  - Lactose-fermenting (pink MacConkey)
  - Oxidase negative
  - Indole positive
  - Motile
- **Colonization**
  - Colon
  - Rectum
  - Vagina
  - Outer urethra
- **Transmission**
  - Contaminated food
  - Person-to-person
  - Animal contact
  - Fomites
- **Virulence**
  - ETEC (enterotoxins)
  - EHEC (Shiga toxin)
  - EPEC (attaching-effacing)
  - EIEC (invasion)
  - EAEC (aggregative adherence)
- **Clinical**: Diarrhoeagenic strains (traveler's diarrhea, hemorrhagic colitis, HUS, infantile diarrhea, dysentery), UTI, Neonatal meningitis, Pneumonia, Bacteremia
- **Risk**
  - Contaminated food/water
  - Hospitalization
  - Neonates
  - Immunocompromised
- **Management**
  - Supportive care (gastroenteritis)
  - Antibiotics (invasive)
  - Standard and contact precautions (MDR)
- **Prevention**
  - Proper food handling
  - Hand hygiene
  - Properly cooked food

##### Klebsiella pneumoniae
- **Tests**
  - Straight GNR
  - Facultative anaerobe
  - Lactose-fermenting (pink mucoid MacConkey)
  - Oxidase negative
  - Indole negative
  - Nonmotile
- **Colonization**
  - Colon
  - Rectum
  - Vagina
  - Outer urethra
- **Transmission**: Person-to-person (especially hospitals)
- **Virulence**
  - Capsule (antiphagocytic)
  - Fimbriae (adherence)
- **Clinical**
  - Hospital-acquired pneumonia
  - UTI
  - Bacteremia
- **Risk**
  - Hospitalization
  - Diabetes
  - Cancer
- **Management**: Appropriate antibiotics
- **Prevention**: Standard and contact precautions (MDR)

##### Proteus species
- **Tests**
  - Straight GNR
  - Facultative anaerobe
  - Non-lactose-fermenting (colorless MacConkey)
  - Oxidase negative
  - Urease positive
  - Motile
  - Swarming on blood agar
- **Colonization**
  - Colon
  - Rectum
  - Vagina
  - Outer urethra
  - Environment
- **Transmission**
  - Direct/indirect contact
  - Fomites
  - Contaminated catheters
- **Virulence**
  - Urease
  - Swarming motility
  - Fimbriae
- **Clinical**
  - UTI (most common)
  - Wound infections
  - Bacteremia
  - Pneumonia
- **Risk**
  - Catheterization
  - Hospitalization
- **Management**: Appropriate antibiotics
- **Prevention**
  - Standard and contact precautions (MDR)
  - Catheter care

##### Salmonella species
- **Tests**
  - Straight GNR
  - Facultative anaerobe
  - Non-lactose-fermenting (colorless MacConkey)
  - Oxidase negative
  - Mainly motile
- **Colonization**: Zoonotic (no human colonization)
- **Transmission**
  - Contaminated food (beef, poultry, eggs)
  - Contaminated water
  - Contact with carriers
- **Virulence**
  - Nontyphoidal (enterotoxin, mucosal invasion)
  - Typhoidal (intracellular survival, Vi antigen)
- **Clinical**
  - Nontyphoidal (gastroenteritis)
  - Typhoidal (enteric fever, typhoid, paratyphoid, rose spots, hepatosplenomegaly, chronic carriage)
- **Risk**
  - Contaminated food/water
  - Contact with carrier
- **Management**
  - Supportive care
  - Antibiotics (severe/invasive)
- **Prevention**
  - Hand hygiene
  - Food safety
  - Vaccination (typhoidal)

#### Gram Negative Rods (Non-Enterobacteriaceae - Curved)

##### Vibrio cholerae
- **Tests**
  - Curved comma-shaped GNR
  - Facultative anaerobe
  - Late lactose-fermenter
  - Oxidase positive
  - Yellow TCBS (sucrose-fermenting)
- **Colonization**: Aquatic/marine environments
- **Transmission**: Contaminated water/food
- **Virulence**
  - Cholera toxin (enterotoxin)
  - TCP (pilus)
  - Mucinase
- **Clinical**
  - Cholera (gastroenteritis)
  - Rice water stool
  - Massive watery diarrhea
  - Severe dehydration
- **Risk**
  - Contaminated water
  - Poor sanitation
  - Endemic regions
- **Management**
  - Rehydration therapy
  - Antibiotics (severe)
- **Prevention**
  - Clean water
  - Sanitation
  - Avoid tap water/raw seafood/street food

##### Vibrio parahaemolyticus
- **Tests**
  - Curved GNR
  - Facultative anaerobe
  - Oxidase positive
  - Green TCBS (non-sucrose-fermenting)
- **Colonization**: Marine environments
- **Transmission**
  - Contaminated seafood
  - Marine recreational water
- **Virulence**
  - Thermostable direct hemolysin
  - Type III secretion
- **Clinical**
  - Gastroenteritis (diarrhea, cramps, nausea, vomiting)
  - Wound infections
- **Risk**
  - Seafood consumption
  - Swimming in marine water
- **Management**
  - Supportive care
  - Antibiotics (severe)
- **Prevention**
  - Avoid cross-contamination
  - Proper seafood handling
  - Avoid poorly maintained pools

#### Gram Negative Cocci

##### Neisseria meningitidis
- **Tests**
  - GN coffee-bean/kidney-bean diplococci
  - Oxidase positive
  - Nonmotile
  - Chocolate agar
- **Colonization**
  - Throat
  - Nasopharyngeal carriage
- **Transmission**
  - Respiratory droplets (≥5 microns)
  - Colonization prerequisite
- **Virulence**
  - Capsular polysaccharide
  - Pili
  - Endotoxin (LPS)
  - IgA protease
- **Clinical**
  - Meningococcal meningitis
  - Meningococcemia
  - Septicemia
  - Petechial/purpuric rash
- **Risk**
  - Age (<5yr, 16-21yr, ≥65yr)
  - Carriage
  - Complement deficiency
  - University students
  - Intimate kissing
  - Lab workers
- **Management**
  - Urgent antibiotics
  - Supportive care
- **Prevention**
  - Vaccination (risk groups)
  - Droplet precautions (24hr after antibiotics)
  - Chemoprophylaxis (contacts)

##### Neisseria gonorrhoeae
- **Tests**
  - GN coffee-bean/kidney-bean diplococci
  - Oxidase positive
  - Nonmotile
  - Chocolate agar
- **Colonization**: Always pathogenic (no colonization)
- **Transmission**
  - Sexual contact
  - Vertical (childbirth)
- **Virulence**
  - Pili (antigenic variation)
  - Opa proteins
  - Por proteins
  - LOS
  - IgA protease
- **Clinical**
  - Gonorrhea (STI)
  - Cervicitis (women)
  - Urethritis (men)
  - Neonatal conjunctivitis
- **Risk**
  - Young age
  - Multiple sexual partners
  - Previous gonorrhea
- **Management**: Ceftriaxone-based regimens
- **Prevention**
  - Condoms
  - Partner notification and treatment

#### Gram Negative Rods (Non-Enterobacteriaceae - Straight)

##### Pseudomonas aeruginosa
- **Tests**
  - Straight GNR
  - Obligate aerobe
  - Oxidase positive
  - Motile
  - Blue-green colonies
  - Pyocyanin and pyoverdin pigments
- **Colonization**: Environment (soil, water, faucets, respiratory equipment, contact lens solutions)
- **Transmission**
  - Healthcare workers' hands
  - Contaminated equipment
  - Recreational water
- **Virulence**
  - Exotoxin A
  - Exoenzyme S
  - Elastase
  - Alkaline protease
  - Pyocyanin
  - Biofilm
- **Clinical**
  - Pneumonia
  - Lung abscess
  - Bacteremia
  - UTI
  - Skin infections (hot tub rash, ecthyma gangrenosum, burn wounds)
  - Otitis externa (swimmer's ear)
  - Eye infections
- **Risk**
  - Hospitalized
  - Immunocompromised
  - Burns
  - Ventilators
  - Catheters
  - Recreational water
- **Management**: Antipseudomonal antibiotics
- **Prevention**
  - Standard and contact precautions (MDR)
  - Avoid poorly maintained pools
  - Contact lens care

##### Burkholderia pseudomallei
- **Tests**
  - Straight GNR with bipolar staining (safety pins)
  - Oxidase positive
  - Cornflower colonies
  - Metallic sheen MacConkey
- **Colonization**: Environment (mud/soil, fresh water in endemic regions)
- **Transmission**
  - Percutaneous inoculation (soil/water contact)
  - Inhalation
  - Ingestion (rare)
- **Virulence**
  - Capsule
  - Type III and VI secretion
  - Flagella
  - Quorum sensing
- **Clinical**
  - Melioidosis (Whitmore's disease)
  - Most asymptomatic
  - Pneumonia (most common when symptomatic)
  - Localized skin infection
- **Risk**
  - Diabetes
  - Alcoholism
  - Chronic renal disease
  - Farming
- **Management**
  - Ceftazidime
  - Meropenem
  - Prolonged therapy
- **Prevention**
  - Cover wounds
  - Boots/gloves in endemic areas
  - Avoid soil/water exposure
  - Wound cleansing

#### Gram Negative Coccobacilli

##### Brucella species
- **Tests**
  - Small GN coccobacilli
  - Oxidase positive (most)
  - Urease positive
  - Nonmotile
- **Colonization**: Zoonotic
- **Transmission**
  - Unpasteurized milk/dairy
  - Direct contact with animal fluids
  - Inhalation of aerosols
- **Virulence**
  - Intracellular survival
  - LPS (reduced endotoxicity)
  - Phagosome-lysosome fusion inhibition
- **Clinical**
  - Brucellosis
  - Prolonged fever (≥2 weeks)
  - Nonspecific symptoms
  - Focal infections (epidural abscess, spondylitis)
- **Risk**
  - Farmers
  - Slaughterhouse workers
  - Veterinarians
  - Microbiologists
  - Unpasteurized dairy consumption
- **Management**: Prolonged combination antibiotic therapy
- **Prevention**
  - Pasteurized dairy
  - Cooked meat
  - PPE for high-risk occupations

#### Pleomorphic Gram Negative Bacteria

##### Acinetobacter baumannii
- **Tests**
  - Pleomorphic (GNR, GNC, or GNCB)
  - Non-lactose-fermenting
  - Oxidase negative
  - Nonmotile
- **Colonization**
  - Environment (water, soil)
  - Hospitals (ventilation, catheters)
  - Human skin/wounds/respiratory/GI
- **Transmission**
  - Person-to-person (healthcare workers)
  - Contaminated surfaces/fomites
- **Virulence**
  - Biofilm
  - Desiccation resistance
  - Outer membrane proteins
  - Efflux pumps
- **Clinical**: Healthcare-associated infections (ventilator pneumonia, bacteremia, UTI, wounds, meningitis)
- **Risk**
  - ICU admission
  - Surgery
  - Catheterization
  - Antibiotic exposure
- **Management**: Antibiotics (often MDR, may need carbapenems/colistin)
- **Prevention**
  - Environmental cleaning
  - Standard and contact precautions (MDR)

### Classification by Other Characteristics

#### Spirochaetes

##### Leptospira interrogans
- **Tests**
  - Spiral-shaped
  - Not visible on Gram stain
  - Darkfield microscopy
- **Colonization**: Zoonotic (rodents, cattle, sheep, goats)
- **Transmission**
  - Urine from infected animals
  - Contaminated water/soil
  - Entry via cuts/mucosa/conjunctivae
- **Virulence**
  - Outer membrane proteins
  - Adhesins
  - Hemolysins
  - LPS
- **Clinical**
  - Leptospirosis
  - Asymptomatic/subclinical
  - Self-limited
  - Severe multiorgan failure
  - Fever
  - rigors
  - myalgias
  - headache
  - Conjunctival suffusion (characteristic)
- **Risk**
  - Farmers
  - Sewer workers
  - Veterinarians
  - Jungle trekking
  - Swimming/kayaking in endemic areas
- **Management**
  - Penicillin
  - Doxycycline
  - Supportive care
- **Prevention**
  - Eliminate animal contact
  - Avoid contaminated water
  - Protective clothing/footwear

##### Treponema pallidum
- **Clinical**: Syphilis

##### Borrelia burgdorferi
- **Clinical**: Lyme disease

#### Bacteria That Cannot Be Gram Stained

##### Chlamydia species
- **Clinical**
  - Community-acquired pneumonia (C. pneumoniae)
  - Psittacosis (C. psittaci)
  - Urethritis/Trachoma (C. trachomatis)

##### Mycoplasma pneumoniae
- **Clinical**: Community-acquired pneumonia

##### Legionella pneumophila
- **Clinical**: Legionnaires' disease (pneumonia)

##### Rickettsia prowazekii
- **Clinical**: Epidemic typhus (zoonotic)

##### Orientia tsutsugamushi
- **Clinical**: Scrub typhus (zoonotic)

##### Coxiella burnetii
- **Clinical**: Q fever (zoonotic)

## Fungi

### Classification by Morphology

#### Yeasts (Unicellular)
- Single cells, spherical to ellipsoid (3-15 μm)
- Reproduce by budding
- Soft, opaque, cream-colored colonies (1-3mm)
- Gram positive cocci appearance
- **Identification**
  - Grow at 30/37°C
  - SDA
  - Germ-tube test
  - Biochemical tests
  - MALDI-TOF
  - ITS sequencing

#### Molds (Multicellular Filamentous)
- Thread-like filaments (hyphae)
- Interweave to form mycelium
- **Identification**
  - Colonial morphology
  - Microscopic examination
  - MALDI-TOF

#### Dimorphic Fungi
- Yeast in tissue, Hyphal at room temperature
- Examples: Sporothrix, Blastomyces, Coccidioides, Histoplasma, Paracoccidioides, Talaromyces

### Classification by Clinical Type

#### Superficial Mycoses

##### Malassezia furfur
- **Specimen**: Skin scrapings
- **Tests**
  - KOH preparation (spaghetti and meatballs)
  - SDA with olive oil
- **Colonization**: Skin (normal flora)
- **Transmission**
  - Direct contact
  - Endogenous
- **Virulence**
  - Lipase
  - Phospholipase
  - Melanin inhibition
- **Clinical**
  - Pityriasis versicolor (hypopigmented lesions, itching, scaling)
  - Seborrheic dermatitis
  - Dandruff
- **Risk**
  - Hot humid climate
  - Oily skin
  - Immunosuppression
- **Management**
  - Azole creams
  - Selenium sulfide
  - Ketoconazole topical/oral
- **Prevention**
  - Good hygiene
  - Keep skin dry

##### Exophiala werneckii
- **Clinical**: Tinea nigra (dark discoloration on palm)
- **Management**
  - Topical azoles
  - Keratolytic agents

### Antifungal Agents

#### Polyenes
- **Mechanism**
  - Bind ergosterol
  - disrupt membrane
- **Agents**
  - Amphotericin B (IV)
  - Nystatin (topical)
- **Pathogens**
  - Candida
  - Cryptococcus
  - Aspergillus
  - Zygomycetes
  - Endemic mycoses

#### Allylamines
- **Mechanism**: Block ergosterol synthesis
- **Agents**: Terbinafine (topical, oral)
- **Pathogens**: Dermatophytes

#### Azoles
- **Mechanism**: Block ergosterol synthesis
- **Agents**
  - Ketoconazole (oral)
  - Itraconazole (IV, oral)
  - Fluconazole (IV, oral)
  - Voriconazole (IV, oral)
- **Pathogens**
  - Endemic mycoses
  - Aspergillus
  - Candida
  - Cryptococcus
  - Dermatophytes

#### Echinocandins
- **Mechanism**: Inhibit cell wall synthesis
- **Agents**: Caspofungin (IV)
- **Pathogens**
  - Candida
  - Aspergillus

#### Pyrimidine Inhibitor
- **Mechanism**: Inhibits DNA and protein synthesis
- **Agents**: Flucytosine (oral)
- **Pathogens**
  - Cryptococcus
  - Candida

### Virus Structure and Properties

#### Envelope Status

##### Enveloped Viruses
- More susceptible to inactivation (pH, bile, detergents, alcohol, drying)
- Released by budding
- Spread in large droplets, secretions, organ transplants, blood
- Must stay wet, Cannot survive in GI tract
- Examples: Herpesviruses, Poxviruses, Hepadnaviruses, Flaviviruses, Togaviruses, Coronaviruses, Orthomyxoviruses, Paramyxoviruses, Rhabdoviruses, Filoviruses, Retroviruses

##### Non-enveloped Viruses
- Environmentally stable to temperature, acid, proteases, detergents, drying
- Released by lysis
- Can spread by fomites, hand-to-hand, dust, small droplets
- Can dry out and retain infectivity, Can survive GI tract
- Examples: Adenoviridae, Papillomaviridae, Polyomaviridae, Parvoviridae, Picornaviridae, Caliciviridae, Reoviridae

#### Capsid Symmetry

##### Helical
- RNA viruses: Rabies, Coronavirus, Measles, Ebola
- Helical nucleocapsids always enveloped for human viruses

##### Icosahedral
- All DNA viruses (except poxviruses) and some RNA viruses
- Examples: Poliovirus, Herpesvirus

##### Complex
- Neither helical nor icosahedral
- Examples: Bacteriophage, Poxvirus

### Viral Latency and Cancer

#### Latent Infections
- HSV-1/2: Neurons (dorsal root ganglia)
- VZV: Neurons
- EBV: B cells
- HBV/HCV: Hepatocytes
- HPV: Epithelial cells
- HIV: T-cells, macrophages

#### Cancer-Associated Viruses
- EBV: Nasopharyngeal carcinoma, Burkitt's lymphoma, Hodgkin's lymphoma
- HBV/HCV: Hepatocellular carcinoma
- HPV: Cervical cancer, Oropharyngeal cancer
- HIV: Kaposi sarcoma (via HHV-8)

### Genetic Variation

#### Antigenic Drift
- Point mutations in RNA viruses
- Example: Influenza

#### Antigenic Shift
- Reassortment of segmented RNA viruses
- Example: Influenza (new pandemic strains)

#### Recombination
- DNA viruses (e.g. Herpesviruses)

## Prions

### Definition
- Small proteinaceous infectious particles
- Resistant to procedures that modify nucleic acids
- No nucleic acid content
- Caused by misfolded proteins

### Prion Protein (PrP)
- **Normal**: PrPC (cellular prion protein, α-helix rich)
- **Abnormal**: PrPSc (scrapie form, β-sheet rich)
- Conformational transition from α-helix to β-sheet
- Forms aggregates and amyloid fibrils
- Creates sponge-like lesions in brain

### Human Prion Diseases

#### Creutzfeldt-Jakob Disease (CJD)

##### Sporadic CJD
- Most common form
- Median age: 68 years, Duration: 4-5 months
- Clinical: Dementia, early neurologic signs
- Diagnostic: Periodic sharp waves on EEG, 14-3-3 protein in CSF, MRI abnormalities

##### Variant CJD (vCJD)
- Linked to BSE (mad cow disease)
- Median age: 28 years, Duration: 13-14 months
- Clinical: Psychiatric/behavioral symptoms, painful dysesthesias
- Diagnostic: Pulvinar sign on MRI, florid plaques
- Transmission: BSE-contaminated beef

##### Familial CJD
- Associated with PrP gene mutations

##### Iatrogenic CJD
- Transmission via contaminated surgical instruments, dura mater grafts, pituitary hormones

#### Fatal Familial Insomnia
- Inherited prion disease
- Progressive insomnia and autonomic dysfunction

#### Gerstmann-Sträussler-Scheinker Syndrome (GSS)
- Inherited prion disease
- Progressive ataxia and dementia

#### Kuru
- Transmitted through ritualistic cannibalism
- Historical disease in Papua New Guinea

### Animal Prion Diseases
- Bovine Spongiform Encephalopathy (BSE) - Mad cow disease
- Scrapie - Sheep and goats
- Chronic Wasting Disease - Deer and elk

### Infection Control
- Stringent chemical and autoclave sterilization required
- Prions resistant to standard disinfection
- Special protocols for high-infectivity tissues
- No effective treatment, only supportive care

## Helminths

### Classification

#### Phylum Platyhelminthes (Flatworms)

##### Class Cestoda (Tapeworms)
- Elongated, dorsoventrally flattened, ribbon-like, segmented body
- Hermaphroditic (monoecious)
- Body consists of scolex (head), neck, and strobila (chain of proglottids)
- No digestive system; absorb nutrients through tegument
- Humans can be definitive or intermediate hosts

##### Class Trematoda (Flukes)
- Unsegmented, leaf-shaped, dorsoventrally flat
- Size: 1 mm to several cm
- Two suckers: oral sucker and ventral sucker (acetabulum)
- Simple digestive system, no anus
- Hermaphroditic (monoecious) except blood flukes (diecious)

#### Phylum Nemathelminthes (Roundworms)

##### Class Nematoda (Nematodes)
- Elongated, non-segmented, cylindrical, tapering at both ends
- Pseudocoelom (body cavity)
- Complete digestive, reproductive, nervous, and excretory systems
- Diecious (separate sexes); male smaller with curved posterior end
- Female reproductive structures: paired ovaries, oviducts, uteri, vagina, genital pore
- Male reproductive structures: testis, vas deferens, seminal vesicle, cloaca, spicules, gubernaculum

### Intestinal Nematodes (Soil-Transmitted Helminths)

#### Ascaris lumbricoides (Common Roundworm)
- **Description**
  - Largest human nematode; Female 220-350mm
  - Male 150-310mm
- **Habitat**: Small intestine
- **Infective Stage**: Embryonated eggs
- **Transmission**
  - Fecal-oral
  - Ingestion of infective eggs in contaminated food/water/soil
- **Life Cycle**: Egg ingestion → larvae hatch in small intestine → penetrate intestinal wall → liver → heart → lungs → bronchi → pharynx → swallowed → small intestine (mature to adults); Life span 12-18 months
- **Virulence**
  - Larval migration through tissues
  - Adult worm burden
- **Clinical**
  - Asymptomatic (mild)
  - Pulmonary phase (Löffler's syndrome: fever, cough, dyspnea, eosinophilia)
  - Intestinal obstruction (children <5 years)
  - Abdominal discomfort
  - Malnutrition
  - Stunted growth
  - Ectopic migration
- **Eggs**
  - Fertilized (60x40 μm, ovoid, golden brown with thick albuminous coat)
  - Unfertilized (90x40 μm, elongated, irregular)
  - Decorticated (coat lost)
- **Diagnosis**: Stool microscopy (eggs)
- **Management**
  - Albendazole
  - Mebendazole
- **Prevention**
  - Periodic deworming
  - Improved sanitation
  - Public health education
  - Surgery (obstruction)

#### Trichuris trichiura (Whipworm)
- **Description**
  - Female 35-50mm with blunt tail
  - Male 30-45mm with coiled tail
- **Habitat**: Large intestine (cecum)
- **Infective Stage**: Embryonated eggs
- **Transmission**
  - Fecal-oral
  - Ingestion of barrel-shaped infective eggs
- **Life Cycle**: No pulmonary phase; Eggs ingested → larvae hatch → mature in large intestine; Anterior end embedded in mucosa, posterior hanging in lumen
- **Clinical**
  - Asymptomatic (mild)
  - Mucous bloody diarrhea (heavy)
  - Abdominal pain
  - Rectal prolapse
  - Anemia
  - Clubbing of fingers (children with heavy loads)
- **Eggs**
  - 50-54 x 22-23 μm
  - Barrel-shaped with bipolar mucoid plugs
- **Diagnosis**: Stool microscopy (bipolar barrel-shaped eggs)
- **Management**
  - Albendazole
  - Mebendazole
- **Prevention**
  - Periodic deworming
  - Improved sanitation
  - Public health education

#### Hookworms (Necator americanus, Ancylostoma duodenale)
- **Description**: N. americanus (Female 9-11mm, Male 5-9mm; 2 ventral and 2 dorsal cutting plates; 6,000-11,000 eggs/day; 0.03-0.05ml blood/day; lives up to 18 years), A. duodenale (Female 10-13mm, Male 8-11mm; 4 ventral teeth; 15,000-20,000 eggs/day; 0.16-0.34ml blood/day; lives 1-5 years)
- **Habitat**: Small intestine
- **Infective Stage**: Filariform larvae (L3)
- **Transmission**: Skin penetration by L3 (thin skin between toes, dorsum of feet, soles, hands)
- **Life Cycle**: L3 penetrates skin → bloodstream → heart → lungs → bronchi → pharynx → swallowed → small intestine (mature, attach to wall)
- **Clinical**
  - Ground itch (erythematous papular/vesicular eruptions, edema, itching)
  - Pulmonary manifestations (Löffler's syndrome)
  - Intestinal phase (nausea, vomiting, abdominal pain, diarrhea)
  - Iron deficiency anemia (blood loss)
  - Protein loss
  - Malabsorption
  - Retarded growth and mental development (children)
- **Eggs**
  - 60 x 40 μm
  - Ellipsoidal
  - Thin transparent shell
  - Clear space separating shell from embryo
- **Diagnosis**: Stool microscopy (eggs)
- **Management**
  - Albendazole
  - Mebendazole
  - Iron supplementation
- **Prevention**
  - Periodic deworming
  - Wear shoes
  - Improved sanitation
  - Public health education

#### Strongyloides stercoralis (Threadworm)
- **Description**: Smallest intestinal nematode; Female 2.2 x 0.04 mm; Male free-living
- **Habitat**: Small intestine (mucosa)
- **Infective Stage**: Filariform larvae (L3)
- **Transmission**: Skin penetration by L3
- **Life Cycle**: Two cycles - Parasitic (L3 → skin → bloodstream → lungs → intestine → adult female → eggs → rhabditiform larvae in stool) and Free-living (in soil); Autoinfection possible (rhabditiform → filariform in intestine)
- **Clinical**
  - Cutaneous (rash, pruritus, larva currens - racing larva 5-15 cm/hour, perianal involvement)
  - Pulmonary (Löffler's syndrome)
  - GI (diarrhea, abdominal pain, malabsorption)
  - Hyperinfection syndrome (immunocompromised, especially steroids)
  - Disseminated strongyloidiasis (GIT, brain, lungs, skin - fatal)
- **Larvae**
  - Rhabditiform (225 x 16 μm, short buccal cavity, notched tail)
  - Filariform (700 μm, notched tail)
- **Diagnosis**
  - Stool/sputum examination (rhabditiform larvae with notched tail)
  - ELISA
- **Management**
  - Ivermectin
  - Thiabendazole
  - Albendazole
- **Prevention**
  - Wear shoes
  - Sanitary disposal
  - Screen before immunosuppression (CRITICAL)

#### Enterobius vermicularis (Pinworm)
- **Description**
  - Female 6-12mm with long pointed tail
  - Male 2-5mm with blunt end
- **Habitat**
  - Large intestine
  - Migrates to perianal area to lay eggs
- **Infective Stage**: Embryonated eggs
- **Transmission**
  - Fecal-oral
  - Ingestion of infective eggs
  - Auto-reinfection
  - Retroinfection
- **Life Cycle**: Eggs ingested → hatch in small intestine → migrate to large intestine → mature → gravid females migrate to perianal area at night → lay eggs → die
- **Clinical**
  - Pruritus ani (perianal, perineal, vaginal itching - worse at night)
  - Insomnia
  - Restlessness
  - Nocturnal enuresis
  - Scratching (bleeding, eczema, dermatitis, secondary infection)
  - Ectopic infection (vagina, uterus)
- **Eggs**
  - 50 x 30 μm
  - One side flattened
  - Transparent shell
- **Diagnosis**: Scotch tape technique (perianal swab in morning)
- **Management**
  - Albendazole
  - Mebendazole
  - Treat entire household
- **Prevention**
  - Personal hygiene
  - Avoid crowded places
  - Frequent handwashing

### Blood and Tissue Nematodes (Filarial Worms)

#### Wuchereria bancrofti
- **Disease**: Lymphatic filariasis (Elephantiasis)
- **Habitat**
  - Lymphatic system
  - Lymph nodes
- **Vectors**: Mosquitoes (Culex, Anopheles, Aedes)
- **Infective Stage**: L3 larvae
- **Transmission**: Mosquito bite deposits L3 → lymphatics → mature to adults → microfilariae in blood
- **Distribution**
  - Tropical and subtropical regions; 1.3 billion at risk
  - >120 million infected
- **Microfilariae**
  - 244-296 x 7.5-10 μm
  - Sheathed (unstained with Giemsa)
  - Body bends in smooth curves
  - No terminal nuclei
  - Discrete body nuclei
  - Anterior cephalic space ratio 1:1
  - Nocturnal periodicity
- **Clinical**: Acute (inflammatory filariasis: lymphangitis, lymphadenitis, epididymo-orchitis, filarial fever), Chronic (10-15 years: lymphedema, hydrocele 40-60%, elephantiasis of limbs/scrotum/breast/vulva, chyluria)
- **Diagnosis**
  - Blood smear (thick, Giemsa stain, nighttime collection 10 PM-2 AM)
  - Microfilariae identification
  - Antigen detection
  - Serology
- **Management**
  - Diethylcarbamazine (DEC)
  - Albendazole
  - Ivermectin
  - Surgery (hydrocele)
- **Prevention**
  - Mass drug administration (MDA)
  - Mosquito control
  - Insecticide-treated nets

#### Brugia malayi, Brugia timori
- **Disease**: Lymphatic filariasis
- **Habitat**: Lymphatic system
- **Vectors**
  - Mansonia
  - Anopheles
  - Aedes mosquitoes
- **Distribution**
  - Southeast Asia (B. malayi)
  - Eastern Indonesia (B. timori)
- **Microfilariae**: B. malayi (177-230 x 5-6 μm, Sheathed, stains dark purple with Giemsa, Body bends in kinky curves, Terminal and subterminal nuclei, Indiscrete body nuclei, Anterior cephalic space ratio 2:1, Subperiodic or nocturnal)
- **Clinical**
  - Similar to W. bancrofti but less severe elephantiasis
  - Usually affects lower limbs
- **Diagnosis**: Blood smear (microfilariae identification - distinguish by sheath staining, body nuclei, cephalic space)
- **Management**
  - DEC
  - Albendazole
  - Ivermectin
- **Prevention**
  - Mosquito control
  - MDA

### Tissue Nematodes

#### Trichinella spiralis
- **Disease**: Trichinosis (Trichinellosis)
- **Habitat**: Encysted larvae in striated muscle
- **Infective Stage**: Encysted larvae in meat
- **Transmission**: Ingestion of undercooked meat (pork, bear, walrus) containing cysts
- **Life Cycle**: Larvae released in stomach → mature in small intestine → female viviparous (produces larvae, not eggs) → newborn larvae penetrate intestinal wall → bloodstream → encyst in striated muscle
- **Clinical**: (1) Intestinal phase (2-7 days: diarrhea, abdominal pain, nausea, vomiting, fever), (2) Muscle invasion phase (2nd week: fever, periorbital edema, myalgia, weakness, muscle tenderness, eosinophilia), (3) Convalescent stage (3-4 weeks: symptoms subside, recovery in 2-6 months)
- **Diagnosis**
  - Muscle biopsy (encysted larvae)
  - Serology
  - Eosinophil count
- **Management**
  - Mebendazole
  - Albendazole
  - Corticosteroids (severe)
- **Prevention**
  - Cook meat at 77°C (170°F)
  - Freeze meat
  - Avoid raw/undercooked pork

### Intestinal Cestodes (Tapeworms)

#### Taenia solium (Pork Tapeworm)
- **Definitive Host**: Human (adult worm)
- **Intermediate Host**
  - Swine
  - Human (larva)
- **Adult Habitat**: Small intestine
- **Infective Stage**: Cysticercus cellulosae (larva in pork) for taeniasis; Eggs for cysticercosis
- **Transmission**
  - Taeniasis (undercooked pork with cysts)
  - Cysticercosis (fecal-oral contamination with eggs, autoinfection)
- **Adult**
  - Up to 6m long
  - Creamy white
  - Scolex with 4 suckers + rostellum with 25-50 hooklets
  - Neck
  - Strobila (proglottids)
- **Eggs**
  - 31-43 μm
  - Rounded
  - Thick radially striated brown shell
  - Hexacanth embryo (6 hooklets)
  - Identical to T. saginata
- **Proglottids**: Gravid proglottids with 7-12 lateral uterine branches per side
- **Clinical**: Taeniasis (mild: deprivation of nutrition, GI disturbances, abdominal pain, vomiting, diarrhea, intestinal obstruction), Cysticercosis (CNS most common: headache, dizziness, seizures, epilepsy, hydrocephalus; Eye: blurred vision, retinal detachment; Heart; Muscle; Subcutaneous nodules; Life-threatening)
- **Diagnosis**
  - Taeniasis (eggs/proglottids in feces, count uterine branches)
  - Cysticercosis (biopsy, serology ELISA, radiology CT/MRI, ophthalmoscopy)
- **Management**
  - Praziquantel
  - Niclosamide
  - Surgery (neurocysticercosis)
  - Corticosteroids (reduce inflammation)
- **Prevention**
  - Cook pork thoroughly
  - Meat inspection
  - Improved sanitation
  - Handwashing

#### Taenia saginata (Beef Tapeworm)
- **Definitive Host**: Human
- **Intermediate Host**: Cattle
- **Adult Habitat**: Small intestine
- **Infective Stage**: Cysticercus bovis (larva in beef)
- **Transmission**: Undercooked beef containing cysts
- **Adult**
  - Up to 10m long
  - Scolex with 4 suckers
  - NO rostellum or hooklets
- **Eggs**: Identical to T. solium (cannot differentiate)
- **Proglottids**: Gravid proglottids with 15-30 lateral uterine branches per side
- **Clinical**
  - Asymptomatic or mild abdominal discomfort
  - Anal pruritus (crawling proglottids)
- **Diagnosis**: Eggs/proglottids in feces (count uterine branches to differentiate species)
- **Management**
  - Praziquantel
  - Niclosamide
- **Prevention**
  - Cook beef thoroughly
  - Meat inspection

#### Diphyllobothrium latum (Broad Fish Tapeworm)
- **Description**
  - Largest tapeworm infecting humans (up to 10m)
  - Ivory colored
- **Disease**: Diphyllobothriasis
- **Habitat**: Small intestine
- **Intermediate Hosts**
  - 1st - Copepods (procercoid)
  - 2nd - Freshwater fish (plerocercoid)
- **Infective Stage**: Plerocercoid larvae in fish
- **Transmission**: Undercooked/raw freshwater fish
- **Adult**
  - Spatulate scolex with 2 longitudinal grooves (bothria)
  - No hooks
- **Eggs**
  - 58-76 x 40-51 μm
  - Operculated (lidded)
  - Oval
  - Yellow-brown
  - Unembryonated when passed
- **Clinical**
  - Mild (bloating, vague abdominal discomfort, anorexia, nausea, vomiting, diarrhea)
  - Megaloblastic anemia (vitamin B12 deficiency - worm competes for B12)
- **Diagnosis**: Operculated eggs or spatulated scolex in feces
- **Management**
  - Praziquantel
  - Vitamin B12 supplementation (if anemic)
- **Prevention**
  - Cook/freeze fish
  - Prevent fecal contamination of water
  - Public health education

### Cestodes in Other Organs

#### Echinococcus granulosus (Dog Tapeworm)
- **Disease**: Unilocular hydatid disease (Cystic echinococcosis)
- **Definitive Host**
  - Dogs
  - Foxes
  - Wolves (adult worm in intestine)
- **Intermediate Host**
  - Sheep
  - Cattle
  - Humans (hydatid cyst/larva in organs)
- **Habitat**
  - Hydatid cysts in liver (60-70%)
  - lungs (20-25%)
  - bones
  - kidneys
  - spleen
  - muscles
  - CNS
  - eye
- **Infective Stage**: Eggs
- **Transmission**
  - Fecal-oral (dog feces with eggs)
  - Contaminated food/water
- **Adult**
  - 2-7mm (in dog)
  - Scolex with 4 suckers + rostellum with hooks
  - 3 proglottids
- **Life Cycle**: Human ingests eggs → oncosphere hatches → penetrates intestinal wall → bloodstream → organs → develops into thick-walled hydatid cyst (enlarges gradually, produces protoscolices and daughter cysts)
- **Clinical**
  - Asymptomatic for years (20-30 years if slow-growing)
  - Mass lesion effect when large
  - Liver (abdominal pain, nausea, vomiting, hepatomegaly)
  - Lungs (chronic cough, chest pain, dyspnea)
  - Brain (symptoms when small)
  - Cyst rupture (allergic reactions, anaphylaxis, secondary echinococcosis)
- **Diagnosis**
  - Radiography (space-occupying lesion)
  - Ultrasound
  - CT/MRI
  - Serology (ELISA for anti-hydatid antibodies)
  - Casoni skin test
- **Management**
  - Surgical removal (90%)
  - Albendazole/Mebendazole (before/after surgery)
  - PAIR technique (Puncture, Aspiration, Injection of scolicidal agent, Re-aspiration)
- **Prevention**
  - Deworm dogs regularly
  - Don't feed dogs raw offal
  - Hand hygiene
  - Avoid contact with dog feces

### Blood Trematodes (Blood Flukes)

#### Schistosoma species
- **Distribution**: 200-300 million cases in 77 countries; Second most devastating parasitic disease after malaria
- **Characteristics**
  - Diecious (separate sexes)
  - Male with gynecophoral canal holding female

##### Schistosoma haematobium (Bladder Fluke)
- **Habitat**: Veins of urinary bladder plexus
- **Intermediate Host**: Bulinus snails
- **Distribution**
  - Africa
  - Middle East
- **Eggs**
  - 112-170 x 40-70 μm
  - Elongated
  - Terminal spine
- **Clinical**
  - Urinary schistosomiasis (hematuria, dysuria, frequency)
  - Bladder wall granulomas
  - Fibrosis
  - Hydronephrosis
  - Bladder cancer (squamous cell carcinoma)
  - Genital schistosomiasis

##### Schistosoma mansoni (Manson's Fluke)
- **Habitat**: Veins draining large intestine (mesenteric)
- **Intermediate Host**: Biomphalaria snails
- **Distribution**
  - Africa
  - South America
  - Caribbean
  - Middle East
- **Eggs**
  - 114-180 x 45-70 μm
  - Oval
  - Large prominent lateral spine
- **Clinical**: Intestinal schistosomiasis (bloody diarrhea, abdominal pain), Hepatosplenic schistosomiasis (periportal fibrosis, portal hypertension, splenomegaly, esophageal varices, hematemesis)

##### Schistosoma japonicum (Oriental Fluke)
- **Habitat**: Veins of small intestine
- **Intermediate Host**: Oncomelania snails
- **Distribution**
  - China
  - Philippines
  - Indonesia
- **Eggs**
  - 70-100 x 50-65 μm
  - Rounded
  - Small rudimentary lateral spine or knob
- **Clinical**
  - Intestinal and hepatosplenic disease (more severe than S. mansoni)
  - CNS involvement (cerebral granulomas from ectopic eggs)

#### Schistosomiasis - General Features
- **Infective Stage**: Free-swimming cercariae
- **Transmission**: Skin penetration by cercariae while in freshwater
- **Life Cycle**: Cercariae penetrate skin → schistosomula → bloodstream → lungs → liver → mature → migrate to final habitat → mate → eggs laid → eggs penetrate tissues → excreted in urine (S. haematobium) or feces (S. mansoni, S. japonicum) → hatch in water → miracidium → infect snails → sporocysts → cercariae released
- **Clinical**: (1) Cercarial dermatitis (pruritic papular rash within 24 hours), (2) Katayama fever (acute schistosomiasis 2-4 weeks post-exposure: fever, cough, hepatosplenomegaly, lymphadenopathy, eosinophilia), (3) Chronic schistosomiasis (months-years: organ-specific pathology from granulomas around eggs)
- **Diagnosis**
  - Microscopy (eggs in urine/feces - identify by spine location)
  - Rectal/liver/bladder biopsy
  - Serology (antibody detection for travelers)
  - Eosinophilia
- **Management**
  - Praziquantel (drug of choice)
  - Corticosteroids (Katayama fever)
- **Prevention**
  - Avoid freshwater in endemic areas
  - Snail control
  - Improved sanitation
  - Mass drug administration
  - Safe water access
  - Vaccine development

### Liver Trematodes (Liver Flukes)

#### Clonorchis sinensis / Opisthorchis viverrini (Chinese/Asian Liver Fluke)
- **Disease**: Clonorchiasis / Opisthorchiasis
- **Habitat**
  - Bile ducts
  - Gallbladder
- **Intermediate Hosts**
  - 1st - Snails (cercariae)
  - 2nd - Freshwater fish (metacercariae)
- **Infective Stage**: Metacercariae in fish
- **Transmission**: Undercooked/raw freshwater fish
- **Distribution**
  - Northeast Thailand
  - Laos
  - Cambodia
  - Vietnam
  - China
  - Korea
- **Adult**
  - 5-10mm long
  - Flat
  - Reddish
- **Eggs**
  - 26-30 x 15-17 μm
  - Operculated
  - Jug-shaped with prominent shoulders around operculum
  - Small knob at posterior end
- **Clinical**
  - Asymptomatic (light)
  - Fatigue
  - Abdominal discomfort
  - Anorexia
  - Weight loss
  - Dyspepsia
  - Diarrhea
  - Obstructive jaundice
  - Pancreatitis
  - Recurrent cholangitis
  - Cholangiocarcinoma (Group 1 biological carcinogen - IARC 2009)
- **Diagnosis**
  - Eggs in feces or duodenal aspirate
  - Serology
  - Ultrasound/CT (dilated bile ducts)
- **Management**
  - Praziquantel
  - Triclabendazole
- **Prevention**
  - Cook fish thoroughly
  - Avoid raw/dried/salted fish
  - Public health education

#### Fasciola hepatica (Sheep Liver Fluke)
- **Disease**: Fascioliasis
- **Habitat**
  - Liver parenchyma
  - Bile ducts
- **Intermediate Hosts**
  - 1st - Snails (cercariae)
  - 2nd - Water plants (metacercariae on watercress, water spinach)
- **Infective Stage**: Metacercariae on aquatic plants
- **Transmission**: Ingestion of contaminated water plants
- **Distribution**
  - Cosmopolitan
  - Common in sheep-raising countries
- **Adult**
  - 3cm long
  - Brown to pale
  - Leaf-shaped
  - Large
- **Eggs**
  - 130-150 x 60-90 μm
  - Large
  - Operculated
  - Elliptical-oval
  - Yellow-brown
- **Clinical**: (1) Early/Acute phase (migration through liver: abdominal pain, nausea, vomiting, hepatomegaly, fever, cough, eosinophilia), (2) Chronic phase (months-years: cholangitis, cholecystitis, biliary obstruction, pancreatitis)
- **Diagnosis**
  - Eggs in feces (large operculated)
  - Serology
  - Imaging (liver lesions)
- **Management**
  - Triclabendazole (drug of choice)
  - Praziquantel
- **Prevention**
  - Avoid raw water vegetables
  - Cook watercress/water spinach
  - Separate pig farming from plant cultivation

### Intestinal Trematodes (Intestinal Flukes)

#### Fasciolopsis buski (Giant Intestinal Fluke)
- **Description**: Largest trematode infecting humans (2-7cm)
- **Disease**: Fasciolopsiasis
- **Habitat**: Small intestine (duodenum, jejunum)
- **Intermediate Hosts**
  - 1st - Snails
  - 2nd - Water plants (water chestnuts, bamboo, caltrop, lotus)
- **Infective Stage**: Metacercariae on water plants

- **Distribution**: Central and Southeast Asia
- **Eggs**
  - 130-140 x 80-85 μm
  - Large
  - Ellipsoidal
  - Unembryonated
  - Thin shell
  - Small indistinct operculum (similar to F. hepatica but slightly smaller)
- **Clinical**
  - Asymptomatic (light)
  - Abdominal pain
  - Nausea
  - Vomiting
  - Fever
  - Diarrhea with mucus
  - Intestinal obstruction
  - Allergic reactions
  - Edema (face, lower limbs)
  - Anemia
  - Vitamin B12 deficiency
  - Malabsorption
  - Eosinophilia
- **Diagnosis**: Eggs in feces
- **Management**: Praziquantel
- **Prevention**
  - Cook water vegetables
  - Separate pig rearing from water plant cultivation

### Lung Trematodes (Lung Flukes)

#### Paragonimus westermani (Lung Fluke)
- **Description**
  - 7-15mm long
  - Pinkish-brown
  - Leaf-like
- **Disease**: Paragonimiasis
- **Habitat**: Lungs (in pairs within cysts)
- **Intermediate Hosts**
  - 1st - Snails
  - 2nd - Freshwater crabs/crayfish (metacercariae)
- **Infective Stage**: Metacercariae in crustaceans
- **Transmission**: Ingestion of raw/undercooked freshwater crabs or crayfish
- **Distribution**
  - Southeast Asia
  - Korea
  - Japan
  - China
  - West Africa
  - Latin America
- **Life Span**: 5-6 years
- **Eggs**
  - 80-120 x 45-70 μm
  - Operculated
  - Oval
  - Yellow-brown
  - Thick shell
  - Often asymmetrical
  - Unembryonated
- **Clinical**: Acute phase (invasion: diarrhea, abdominal pain, fever, cough, urticaria, hepatosplenomegaly, pulmonary infiltrates, eosinophilia), Chronic pulmonary phase (10-15 years: chronic cough, rust-colored sputum, hemoptysis, dyspnea, chest pain, resembles tuberculosis), Extrapulmonary (brain - seizures, visual disturbances, space-occupying lesions; abdominal organs; subcutaneous nodules)
- **Diagnosis**
  - Eggs in sputum (rust-colored) or feces
  - Serology
  - Chest X-ray (nodular/ring shadows)
  - CT/MRI (brain lesions)
- **Management**
  - Praziquantel
  - Triclabendazole
  - Corticosteroids (cerebral infections)
  - Surgery (brain cysts)
- **Prevention**
  - Cook crabs/crayfish thoroughly
  - Avoid raw/pickled crustaceans
  - Public health education

## Arthropods

### General Characteristics
- Phylum Arthropoda (~10 million species)
- Invertebrate animals with chitinous exoskeleton
- Segmented body, Paired jointed appendages
- Bilaterally symmetrical
- Must molt for growth
- Open circulatory system with hemolymph
- Compound eyes and simple eyes (ocelli)
- Separate genders

### Medical Importance Categories
- Bites and nuisance
- Allergy induction
- Venom production
- Ectoparasites
- Disease vectors (mechanical, biological, transovarial transmission)
- Intermediate hosts of pathogens

### Classification

#### Class Hexanauplia (Copepods)
- **Dracunculus medinensis (Guinea worm)**: Dracunculiasis
- **Intermediate hosts**: Copepods for Diphyllobothrium latum (fish tapeworm - procercoid larvae)

#### Class Arachnida

##### Mites (Trombiculidae, Sarcoptidae)

###### Trombicula species (Chiggers)
- **Names**
  - Chiggers
  - Red bugs
  - Scrub-itch mites
  - Harvest mites
- **Distribution**: Worldwide
- **Parasitic Stage**: Larval stage only (6 legs)
- **Adult**
  - Free-living
  - Non-parasitic (8 legs)
- **Feeding**: Larvae attach to skin → inject enzymes → digest cellular content → form stylostome (tube-like structure) → suck digested product
- **Clinical**: Ground itch (itching 24-48 hours after bite, intense itchiness from enzymes, erythematous papular/vesicular eruptions, edema), Secondary bacterial infection
- **Duration**: Larvae attached 3-5 days before dropping off
- **Disease Vector**: Leptotrombidium deliense transmits Orientia tsutsugamushi (scrub typhus)
- **Management**
  - Topical corticosteroids
  - Antihistamines

###### Sarcoptes scabiei (Scabies Mite)
- **Disease**: Scabies
- **Distribution**: Worldwide

- **Life Stages**: Egg → 6-legged larva → 8-legged nymph → 8-legged adult

##### Order: Diptera (Flies and Mosquitoes)

###### Family: Culicidae (Mosquitoes)

####### Mosquito Characteristics
- **Mouthparts**: Long proboscis for piercing and sucking blood
- **Sexual Dimorphism**
  - Females blood-feeders (need protein for eggs)
  - Males feed on nectar
- **Life Stages**: Egg → Larva (aquatic) → Pupa (aquatic) → Adult (aerial)

####### Anopheles species
- **Subfamily**: Anophelinae
- **Characteristics**
  - Palps as long as proboscis
  - Adults rest with abdomen at angle
  - No siphon in larvae (rest parallel to water surface)
- **Eggs**
  - Laid individually on water
  - Each egg has lateral floats
- **Diseases Transmitted**
  - Malaria (Plasmodium species: P. falciparum, P. vivax, P. ovale, P. malariae, P. knowlesi)
  - Lymphatic filariasis (Wuchereria bancrofti, Brugia species)
  - O'nyong-nyong fever (O'nyong-nyong virus)
- **Distribution**: Tropical and subtropical regions worldwide
- **Biting Time**: Mainly evening and night

####### Aedes species
- **Subfamily**: Culicinae
- **Characteristics**
  - Palps shorter than proboscis
  - Adults hold abdomen parallel to surface
  - Larvae with siphon (rest at angle to water surface)
- **Eggs**
  - Laid individually beside water (drought-resistant)
  - No floats
  - Black/dark brown
- **Diseases Transmitted**
  - Dengue fever (DENV 1-4)
  - Zika fever (Zika virus)
  - Chikungunya (Chikungunya virus)
  - Yellow fever (Yellow fever virus)
  - Lymphatic filariasis (W. bancrofti)
  - Japanese encephalitis (JE virus)
- **Key Species**
  - Ae. aegypti (dengue, Zika, yellow fever)
  - Ae. albopictus (dengue, chikungunya)
  - Ae. japonicus (Japanese encephalitis)
- **Distribution**: Tropical and temperate regions
- **Biting Time**: Daytime (Ae. aegypti, Ae. albopictus)

####### Culex species
- **Subfamily**: Culicinae
- **Eggs**
  - Laid in rafts on water
  - No floats
- **Diseases Transmitted**
  - Lymphatic filariasis (W. bancrofti, Brugia malayi)
  - Japanese encephalitis (JE virus)
  - West Nile encephalitis (West Nile virus)
  - St. Louis encephalitis (SLE virus)
- **Distribution**: Worldwide
- **Biting Time**: Evening and night

####### Mansonia species
- **Subfamily**: Culicinae
- **Eggs**: Laid in star-shaped clusters on undersurface of floating aquatic plants
- **Larvae**
  - Siphon adapted for piercing aquatic plants to obtain air
  - Rest at angle attached to plant roots
- **Diseases Transmitted**: Lymphatic filariasis (W. bancrofti, Brugia malayi)
- **Distribution**
  - Southeast Asia
  - Africa
  - South America

####### Vectorial Capacity Factors
- **Extrinsic Factors**
  - Temperature
  - Rainfall
  - Pathogen titer
  - Larval competition (affect extrinsic incubation period)
- **Intrinsic Factors**
  - Vector competence (ability to become infected and transmit)
  - Blood feeding hours
  - Host specificity (anthropophagic vs zoophagic vs zoo-anthropophagic)
  - Life span

###### Myiasis-Causing Flies

####### Definition
- **Myiasis**: Infection by fly larvae (maggots) in human tissues
- **Etymology**: Greek "myia" (fly)
- **Distribution**
  - Tropical and subtropical regions
  - especially rural areas

####### Types by Specificity

######## Obligatory Myiasis
- **Definition**: Flies require living host for larval development
- **Agents**
  - Cordylobia anthropophaga (tumbu fly)
  - Chrysomya bezziana (Old World screwworm)
  - Cochliomyia hominivorax (New World screwworm)
  - Dermatobia hominis (human botfly)
  - Auchmeromyia senegalensis (Congo floor maggot)
  - Gasterophilus intestinalis (horse botfly)
  - Oestrus ovis (sheep botfly)
  - Hypoderma species (warble flies)

######## Facultative Myiasis
- **Definition**: Flies normally lay eggs on decaying matter but opportunistically infest open wounds
- **Agents**
  - Musca domestica (house fly)
  - Lucilia spp. (green bottle fly)
  - Phormia spp. (blow fly)
  - Calliphora spp. (blow fly)
  - Sarcophaga spp. (flesh fly)

######## Accidental Myiasis (Pseudomyiasis)
- **Definition**: Accidental ingestion of eggs/larvae
- **Agents**
  - Various flies
  - Often gastrointestinal myiasis

####### Cordylobia anthropophaga (Tumbu Fly)
- **Distribution**: Tropical Africa
- **Transmission**: Eggs laid on clothes hung outdoors → hatch in 24-72 hours → larvae penetrate wearer's skin
- **Clinical**
  - Furuncular lesions
  - Sensation of movement
  - Breathing pore visible
- **Management**: Occlusion (petroleum jelly) → larva emerges for air → remove

####### Chrysomya bezziana (Old World Screwworm)
- **Distribution**
  - Asia
  - Tropical Africa
  - India
  - Papua New Guinea
- **Characteristics**
  - Obligatory parasite
  - Blue-green metallic fly
- **Oviposition**
  - Wounds
  - Open sores
  - Mucous membranes
- **Feeding**
  - Larvae burrow into living tissue (healthy and necrotic)
  - Feed on living tissue
- **Clinical**
  - Tissue destruction
  - Characteristic odor attracts more flies
  - Permanent tissue damage
  - Can be fatal
- **Forensic Importance**
  - Can cause myiasis pre-mortem
  - May affect post-mortem interval estimation
- **Management**
  - Surgical removal of larvae
  - Debridement
  - Antibiotics

####### Cochliomyia hominivorax (New World Screwworm)
- **Distribution**: New World (Americas)
- **Characteristics**
  - Obligatory parasite
  - Larvae screw deeper when disturbed
- **Oviposition**
  - Exposed flesh
  - Wounds
  - Navels
  - Mucous membranes
- **Life Cycle**: Larvae hatch rapidly → burrow into subdermal tissue → feed 3-7 days → drop to ground → pupate ~1 week → adults emerge; Total cycle ~3 weeks
- **Clinical**: Severe tissue damage leading to death possible
- **Control**
  - Sterile Insect Technique (SIT) - females mate once
  - Release sterile males to reduce population
- **Management**
  - Surgical removal
  - Wound care

####### Dermatobia hominis (Human Botfly)
- **Distribution**: Central/South America
- **Transmission**: Passive transfer - Female captures mosquito/tick → attaches eggs → when vector feeds on human → eggs hatch → larvae penetrate skin
- **Clinical**
  - Furuncular myiasis
  - Painful boil-like lesions
  - Sensation of movement
  - Central pore for larval breathing
- **Management**
  - Occlusion (bacon, petroleum jelly) → larva emerges → remove
  - Surgical extraction

####### Clinical Features of Myiasis
- **Cutaneous**
  - Painful non-healing ulcers
  - Sensation of movement/wriggling
  - Discharge from central hole
  - Pruritus
  - White structure protruding (part of maggot)
  - Bubbling when submerged (larval respiration)
  - Migratory myiasis (Gasterophilus - moves 20-30 cm/day)
- **Gastrointestinal**
  - Difficult to diagnose
  - Abdominal pain
  - Nausea
  - Vomiting
- **Genitourinary**: Difficult to diagnose
- **Ophthalmomyiasis**
  - Vision problems
  - Eye damage
- **Wound Myiasis**
  - Maggots in wounds
  - Tissue destruction
  - Foul odor

####### Diagnosis
- **Direct**: Locate and extract larvae from tissue
- **Identification**: Morphological features (anterior/posterior spiracles, mouthparts, cephalopharyngeal skeleton, cuticular spines)
- **History**
  - Travel history
  - Exposure to risk factors
- **Imaging**
  - Ultrasound
  - X-ray/CT/MRI
- **Serology**: ELISA (used previously for ophthalmomyiasis)

####### Management
- **Surgical**
  - Removal of larvae
  - Debridement of necrotic tissue
- **Medical**
  - Antibiotics (secondary infections)
  - Ivermectin (some cases)
- **Wound Care**
  - Cleaning
  - Dressing

####### Prevention
- **Protective Clothing**: Cover skin in endemic areas
- **Avoid**: Hanging clothes outdoors in endemic areas
- **Hygiene**
  - Clean wounds promptly
  - Cover wounds
- **Sanitation**: Proper waste disposal
- **Insect Control**
  - Screens
  - Repellents

- **Agents**

  - Hornets
  - Fire ants
- **Clinical**
  - Immediate-type allergic reactions
  - Systemic reactions
  - Anaphylaxis

##### Inhalation/Ingestion Allergens
- **Major Allergen**: Tropomyosin (cross-reactive)
- **Sources**
  - House dust mites (Dermatophagoides pteronyssinus)
  - Cockroaches
  - Crustaceans (seafood allergy)
- **Scabies**

##### Lepidopterism
- **Definition**: Cutaneous and systemic reactions from contact with caterpillars or adult moths/butterflies
- **Clinical**
  - Dermatitis
  - Systemic reactions

#### Venom Production

##### Rove Beetle (Paederus species)
- **Venom**: Paederine (toxic amide in hemolymph)
- **Clinical**
  - Dermatitis linearis (Paederus dermatitis)
  - Necrotic blisters on skin after contact

##### Bees, Wasps, Hornets
- **Bee Venom**
  - Melittin
  - Apamin
  - MCD peptides (pain, inflammation)
- **Hornet Venom**
  - Hornet kinin (pain)
  - Acetylcholine (pain nerve stimulation)
  - Phospholipases
  - Mastoparan (degrades immune cells, destroys RBCs and muscle cells)
- **Wasp Venom**
  - Wasp kinin
  - Amines
  - Mastoparan

##### Spiders
- **Black Widow (Latrodectus tredecimguttatus)**: α-Latrotoxin (presynaptic neurotoxin)
- **Clinical**
  - Severe pain
  - Muscle cramps
  - Sweating
  - Hypertension

##### Scorpions
- **Deathstalker (Leiurus quinquestriatus)**: Chlorotoxin (blocks chloride channels)
- **Medical Use**: Chlorotoxin binds glioma cells (diagnostic/therapeutic for cancers)

##### Fire Ants (Solenopsis species)
- **Venom**: 95% water-insoluble alkaloid (2,6 di-substituted piperidines)
- **Properties**
  - Cytotoxic
  - Hemolytic
  - Antibacterial
  - Insecticidal
- **Clinical**
  - Painful burning sensation
  - Pustules
  - Allergic reactions

##### Ticks
- **Tick Paralysis**: Neurotoxin produced by feeding tick (e.g., Dermacentor andersoni)
- **Clinical**
  - Ascending paralysis
  - Weakness
  - Recovery within 24 hours of tick removal

### Modes of Disease Transmission by Arthropod Vectors

#### Mechanical Transmission
- **Definition**: Vector acts as vehicle without pathogen amplification or development
- **Example**: House flies carrying nematode eggs on legs/mouthparts
- **Characteristics**: No biological relationship between pathogen and vector

#### Biological Transmission
- **Definition**
  - Pathogen develops
  - changes
  - or multiplies in vector as part of life cycle
- **Examples**
  - Filarial worms and malaria parasites develop in mosquitoes
  - Dengue virus multiplies in mosquitoes
- **Characteristics**: Essential developmental stage in vector

#### Transovarial Transmission
- **Definition**: Pathogen transmitted from infected vector to progeny via eggs
- **Examples**
  - Scrub typhus (Orientia in mites)
  - Japanese encephalitis (JE virus in Aedes)
  - Dengue (DENV in Ae. aegypti and Ae. albopictus)
- **Significance**: Maintains pathogen in vector population across generations

### Host Feeding Specificity
- **Anthropophagic**: Human-loving (essential for human disease transmission)
- **Zoophagic**: Animal-loving (ornithophagic - birds, simiophagic - simians)
- **Zoo-anthropophagic**: Feeds on both humans and animals (important for zoonotic transmission)

# Infection Prevention and Control <!--markmap: foldAll -->

### Chain of Infection
- Infectious agent
- Reservoir
- Portal of exit
- Mode of transmission
- Portal of entry
- Susceptible host

### Breaking the Chain
- Eliminate/control reservoir
- Block transmission (hand hygiene, PPE, isolation)
- Protect susceptible host (vaccination, prophylaxis)

### Standard Precautions
- Hand hygiene
- PPE (gloves, gowns, masks, eye protection)
- Safe injection practices
- Respiratory hygiene/cough etiquette

### Transmission-Based Precautions
- Contact precautions (MDR bacteria, C. difficile)
- Droplet precautions (N. meningitidis, influenza)
- Airborne precautions (tuberculosis, measles, varicella)

### Antimicrobial Stewardship
- Appropriate antibiotic selection
- Optimal dosing and duration
- Minimize resistance development
- Reduce adverse effects

# Laboratory Diagnosis <!--markmap: foldAll -->

### Specimen Collection
- Timing is crucial
- Proper transport and storage
- Type depends on suspected infection

### Direct Examination
- Microscopy (light, fluorescence, electron)
- Staining methods (Gram, acid-fast, KOH, India ink, GMS, PAS)

### Culture
- Bacteria: Various agars, anaerobic/aerobic conditions
- Fungi: SDA, specialized media, temperature requirements
- Viruses: Cell culture, embryonated eggs
- Protozoa: Specialized media

### Antigen Detection
- Immunofluorescence
- Enzyme immunoassay (EIA/ELISA)
- Lateral flow assays
- Immunochromatography

### Antibody Detection (Serology)
- Acute vs convalescent titers
- IgM (acute) vs IgG (past/immunity)

### Molecular Methods
- PCR and derivatives
- Sequencing
- MALDI-TOF mass spectrometry

### Antimicrobial Susceptibility Testing
- Determines effective treatment
- Identifies resistance patterns
