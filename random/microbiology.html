# Medical Microbiology

## Bacteria

### Classification by Gram Stain

#### Gram Positive Cocci

##### Staphylococcus aureus
- **Tests**: Catalase positive, Coagulase positive, Beta-hemolysis, Yellow colonies
- **Colonization**: Nasal mucosa, Skin, Vagina (30% population)
- **Transmission**: Direct contact, Fomites, Droplets, Contaminated food
- **Virulence**: Exfoliative toxins, Hemolysin, Alpha toxin, TSST-1, Coagulase
- **Clinical**: Pyogenic infections (abscess, cellulitis, endocarditis, osteomyelitis, pneumonia), Toxin-mediated (food poisoning, toxic shock, scalded skin)
- **Risk**: Hospitalization, Surgery, Catheters, Immunocompromised, IVDU, Chronic carriers
- **Management**: MSSA (Cloxacillin, beta-lactams), MRSA (Vancomycin, daptomycin, linezolid), Incision and drainage
- **Prevention**: Hand hygiene, Cover infections, Equipment disinfection

##### Streptococcus pyogenes (Group A Strep)
- **Tests**: Catalase negative, Beta-hemolysis, Bacitracin sensitive, Lancefield Group A
- **Colonization**: Upper respiratory tract (3-5% adults, 10% children)
- **Transmission**: Droplet
- **Virulence**: M protein (antiphagocytic), Streptolysin O and S, Pyrogenic exotoxins, Streptokinase
- **Clinical**: Pyogenic (pharyngitis, tonsillitis, impetigo, erysipelas, necrotizing fasciitis), Toxin-mediated (scarlet fever, toxic shock), Post-infectious (glomerulonephritis, rheumatic fever)
- **Risk**: Immunologic disease occurs weeks after infection
- **Management**: Penicillin G, Amoxicillin, Alternatives (erythromycin, clindamycin)
- **Prevention**: Hand hygiene, Prompt pharyngitis treatment

##### Streptococcus pneumoniae
- **Tests**: Catalase negative, Alpha-hemolysis, Optochin sensitive, Bile solubility positive, Lancet-shaped diplococci
- **Colonization**: Nasopharynx (5-10% adults, 20-40% children)
- **Transmission**: Droplets, Close contact, Aspiration
- **Virulence**: Capsular polysaccharides (antiphagocytic), Pneumolysin, PsaA, PspA, PspC
- **Clinical**: Pneumonia, Meningitis, Otitis media, Sinusitis, Endocarditis
- **Risk**: Depressed cough reflex, Alcohol intoxication, Prior viral infection, Splenectomy, Sickle cell
- **Management**: Penicillin G, Ceftriaxone, Vancomycin, Levofloxacin
- **Prevention**: Vaccination

##### Streptococcus agalactiae (Group B Strep)
- **Tests**: Catalase negative, Beta-hemolysis (small zone), Lancefield Group B
- **Colonization**: Female genital tract (5-30%), GI tract
- **Transmission**: Vertical (childbirth), Direct contact
- **Virulence**: Polysaccharide capsule (antiphagocytic)
- **Clinical**: Neonatal meningitis, Neonatal sepsis, Maternal UTI, Chorioamnionitis
- **Risk**: Prolonged rupture membranes (>18hr), Premature delivery (<37 weeks)
- **Management**: Penicillin G, Amoxicillin, May need aminoglycosides
- **Prevention**: Antibiotic prophylaxis (Penicillin G, ampicillin), Vaginal swab screening

#### Gram Positive Rods

##### Corynebacterium diphtheriae
- **Tests**: Club-shaped GPR, Non-spore forming, PCR for toxin genes
- **Colonization**: Skin, Upper respiratory tract, GI tract
- **Transmission**: Droplets, Direct contact with skin lesions
- **Virulence**: Diphtheria toxin (inhibits protein synthesis), Pseudomembrane formation
- **Clinical**: Respiratory diphtheria (pseudomembrane, airway obstruction), Cutaneous diphtheria (rash, ulcers)
- **Risk**: Unimmunized individuals
- **Management**: Anti-toxin (immediate), Antibiotics (erythromycin, penicillin), Airway protection
- **Prevention**: DTaP vaccination (toxoid)

##### Clostridium botulinum
- **Tests**: Anaerobic, Spore-forming, GPR
- **Colonization**: Soil, Intestinal tract of humans and animals
- **Transmission**: Ingestion of preformed toxins, Ingestion of spores, Wound contamination
- **Virulence**: Botulinum toxin (blocks ACh release), Flaccid paralysis
- **Clinical**: Food botulism (GI symptoms, paralysis), Infant botulism (floppy baby), Wound botulism, Respiratory failure
- **Risk**: Improperly canned food, Honey (infants), IVDU with wounds
- **Management**: Supportive care, Airway management
- **Prevention**: Proper food handling, Adequate heating, Avoid honey in infants

##### Clostridium tetani
- **Tests**: Anaerobic, Spore-forming, GPR, Heat-resistant endospores
- **Colonization**: Soil, Intestinal tract
- **Transmission**: Spores through contaminated wounds
- **Virulence**: Tetanospasmin, Tetanolysin (block inhibitory neurotransmitters), Spastic paralysis
- **Clinical**: Tetanus, Sustained muscle contraction, Opisthotonus (arching back), Respiratory failure
- **Risk**: Puncture wounds, Foreign body, Unimmunized
- **Management**: Passive immunization (tetanus immunoglobulin), Toxoid vaccines, Supportive care
- **Prevention**: Anti-tetanus vaccination

##### Clostridium perfringens
- **Tests**: Anaerobic, Spore-forming, GPR
- **Colonization**: Soil, Intestinal tract
- **Transmission**: Spores contaminating wounds or food
- **Virulence**: Alpha toxin (lecithinase, hemolytic), Enterotoxin, Hyaluronidase, Collagenase
- **Clinical**: Gas gangrene (necrotizing infection, gas production, rapid), Food poisoning (watery diarrhea)
- **Risk**: Wound contamination, Improperly stored food
- **Management**: Metronidazole, Surgical debridement, Supportive care
- **Prevention**: Proper food handling, Adequate heating

##### Clostridium difficile
- **Tests**: Anaerobic, Spore-forming, GPR, Spores alcohol-resistant
- **Colonization**: GI tract (3% healthy adults, 8-10% hospitalized)
- **Transmission**: Fecal-oral via endospores, Person-to-person
- **Virulence**: Enterotoxin A (alters fluid secretion), Enterotoxin B (disrupts cytoskeleton), Spores resist alcohol
- **Clinical**: Antibiotic-associated diarrhea, Pseudomembranous colitis, Watery diarrhea, Abdominal pain
- **Risk**: Antibiotic use (clindamycin, ampicillin, cephalosporins), Elimination of normal flora, Hospitalization
- **Management**: Discontinue offending antibiotic, Specific therapy
- **Prevention**: Avoid inappropriate antibiotics, Hand washing with soap (NOT alcohol), Environmental disinfection

#### Gram Negative Rods (Enterobacteriaceae)

##### Escherichia coli
- **Tests**: Straight GNR, Facultative anaerobe, Lactose-fermenting (pink MacConkey), Oxidase negative, Indole positive, Motile
- **Colonization**: Colon, Rectum, Vagina, Outer urethra
- **Transmission**: Contaminated food, Person-to-person, Animal contact, Fomites
- **Virulence**: ETEC (enterotoxins), EHEC (Shiga toxin), EPEC (attaching-effacing), EIEC (invasion), EAEC (aggregative adherence)
- **Clinical**: Diarrhoeagenic strains (traveler's diarrhea, hemorrhagic colitis, HUS, infantile diarrhea, dysentery), UTI, Neonatal meningitis, Pneumonia, Bacteremia
- **Risk**: Contaminated food/water, Hospitalization, Neonates, Immunocompromised
- **Management**: Supportive care (gastroenteritis), Antibiotics (invasive), Standard and contact precautions (MDR)
- **Prevention**: Proper food handling, Hand hygiene, Properly cooked food

##### Klebsiella pneumoniae
- **Tests**: Straight GNR, Facultative anaerobe, Lactose-fermenting (pink mucoid MacConkey), Oxidase negative, Indole negative, Nonmotile
- **Colonization**: Colon, Rectum, Vagina, Outer urethra
- **Transmission**: Person-to-person (especially hospitals)
- **Virulence**: Capsule (antiphagocytic), Fimbriae (adherence)
- **Clinical**: Hospital-acquired pneumonia, UTI, Bacteremia
- **Risk**: Hospitalization, Diabetes, Cancer
- **Management**: Appropriate antibiotics
- **Prevention**: Standard and contact precautions (MDR)

##### Proteus species
- **Tests**: Straight GNR, Facultative anaerobe, Non-lactose-fermenting (colorless MacConkey), Oxidase negative, Urease positive, Motile, Swarming on blood agar
- **Colonization**: Colon, Rectum, Vagina, Outer urethra, Environment
- **Transmission**: Direct/indirect contact, Fomites, Contaminated catheters
- **Virulence**: Urease, Swarming motility, Fimbriae
- **Clinical**: UTI (most common), Wound infections, Bacteremia, Pneumonia
- **Risk**: Catheterization, Hospitalization
- **Management**: Appropriate antibiotics
- **Prevention**: Standard and contact precautions (MDR), Catheter care

##### Salmonella species
- **Tests**: Straight GNR, Facultative anaerobe, Non-lactose-fermenting (colorless MacConkey), Oxidase negative, Mainly motile
- **Colonization**: Zoonotic (no human colonization)
- **Transmission**: Contaminated food (beef, poultry, eggs), Contaminated water, Contact with carriers
- **Virulence**: Nontyphoidal (enterotoxin, mucosal invasion), Typhoidal (intracellular survival, Vi antigen)
- **Clinical**: Nontyphoidal (gastroenteritis), Typhoidal (enteric fever, typhoid, paratyphoid, rose spots, hepatosplenomegaly, chronic carriage)
- **Risk**: Contaminated food/water, Contact with carrier
- **Management**: Supportive care, Antibiotics (severe/invasive)
- **Prevention**: Hand hygiene, Food safety, Vaccination (typhoidal)

#### Gram Negative Rods (Non-Enterobacteriaceae - Curved)

##### Vibrio cholerae
- **Tests**: Curved comma-shaped GNR, Facultative anaerobe, Late lactose-fermenter, Oxidase positive, Yellow TCBS (sucrose-fermenting)
- **Colonization**: Aquatic/marine environments
- **Transmission**: Contaminated water/food
- **Virulence**: Cholera toxin (enterotoxin), TCP (pilus), Mucinase
- **Clinical**: Cholera (gastroenteritis), Rice water stool, Massive watery diarrhea, Severe dehydration
- **Risk**: Contaminated water, Poor sanitation, Endemic regions
- **Management**: Rehydration therapy, Antibiotics (severe)
- **Prevention**: Clean water, Sanitation, Avoid tap water/raw seafood/street food

##### Vibrio parahaemolyticus
- **Tests**: Curved GNR, Facultative anaerobe, Oxidase positive, Green TCBS (non-sucrose-fermenting)
- **Colonization**: Marine environments
- **Transmission**: Contaminated seafood, Marine recreational water
- **Virulence**: Thermostable direct hemolysin, Type III secretion
- **Clinical**: Gastroenteritis (diarrhea, cramps, nausea, vomiting), Wound infections
- **Risk**: Seafood consumption, Swimming in marine water
- **Management**: Supportive care, Antibiotics (severe)
- **Prevention**: Avoid cross-contamination, Proper seafood handling, Avoid poorly maintained pools

#### Gram Negative Cocci

##### Neisseria meningitidis
- **Tests**: GN coffee-bean/kidney-bean diplococci, Oxidase positive, Nonmotile, Chocolate agar
- **Colonization**: Throat, Nasopharyngeal carriage
- **Transmission**: Respiratory droplets (≥5 microns), Colonization prerequisite
- **Virulence**: Capsular polysaccharide, Pili, Endotoxin (LPS), IgA protease
- **Clinical**: Meningococcal meningitis, Meningococcemia, Septicemia, Petechial/purpuric rash
- **Risk**: Age (<5yr, 16-21yr, ≥65yr), Carriage, Complement deficiency, University students, Intimate kissing, Lab workers
- **Management**: Urgent antibiotics, Supportive care
- **Prevention**: Vaccination (risk groups), Droplet precautions (24hr after antibiotics), Chemoprophylaxis (contacts)

##### Neisseria gonorrhoeae
- **Tests**: GN coffee-bean/kidney-bean diplococci, Oxidase positive, Nonmotile, Chocolate agar
- **Colonization**: Always pathogenic (no colonization)
- **Transmission**: Sexual contact, Vertical (childbirth)
- **Virulence**: Pili (antigenic variation), Opa proteins, Por proteins, LOS, IgA protease
- **Clinical**: Gonorrhea (STI), Cervicitis (women), Urethritis (men), Neonatal conjunctivitis
- **Risk**: Young age, Multiple sexual partners, Previous gonorrhea
- **Management**: Ceftriaxone-based regimens
- **Prevention**: Condoms, Partner notification and treatment

#### Gram Negative Rods (Non-Enterobacteriaceae - Straight)

##### Pseudomonas aeruginosa
- **Tests**: Straight GNR, Obligate aerobe, Oxidase positive, Motile, Blue-green colonies, Pyocyanin and pyoverdin pigments
- **Colonization**: Environment (soil, water, faucets, respiratory equipment, contact lens solutions)
- **Transmission**: Healthcare workers' hands, Contaminated equipment, Recreational water
- **Virulence**: Exotoxin A, Exoenzyme S, Elastase, Alkaline protease, Pyocyanin, Biofilm
- **Clinical**: Pneumonia, Lung abscess, Bacteremia, UTI, Skin infections (hot tub rash, ecthyma gangrenosum, burn wounds), Otitis externa (swimmer's ear), Eye infections
- **Risk**: Hospitalized, Immunocompromised, Burns, Ventilators, Catheters, Recreational water
- **Management**: Antipseudomonal antibiotics
- **Prevention**: Standard and contact precautions (MDR), Avoid poorly maintained pools, Contact lens care

##### Burkholderia pseudomallei
- **Tests**: Straight GNR with bipolar staining (safety pins), Oxidase positive, Cornflower colonies, Metallic sheen MacConkey
- **Colonization**: Environment (mud/soil, fresh water in endemic regions)
- **Transmission**: Percutaneous inoculation (soil/water contact), Inhalation, Ingestion (rare)
- **Virulence**: Capsule, Type III and VI secretion, Flagella, Quorum sensing
- **Clinical**: Melioidosis (Whitmore's disease), Most asymptomatic, Pneumonia (most common when symptomatic), Localized skin infection
- **Risk**: Diabetes, Alcoholism, Chronic renal disease, Farming
- **Management**: Ceftazidime, Meropenem, Prolonged therapy
- **Prevention**: Cover wounds, Boots/gloves in endemic areas, Avoid soil/water exposure, Wound cleansing

#### Gram Negative Coccobacilli

##### Brucella species
- **Tests**: Small GN coccobacilli, Oxidase positive (most), Urease positive, Nonmotile
- **Colonization**: Zoonotic
- **Transmission**: Unpasteurized milk/dairy, Direct contact with animal fluids, Inhalation of aerosols
- **Virulence**: Intracellular survival, LPS (reduced endotoxicity), Phagosome-lysosome fusion inhibition
- **Clinical**: Brucellosis, Prolonged fever (≥2 weeks), Nonspecific symptoms, Focal infections (epidural abscess, spondylitis)
- **Risk**: Farmers, Slaughterhouse workers, Veterinarians, Microbiologists, Unpasteurized dairy consumption
- **Management**: Prolonged combination antibiotic therapy
- **Prevention**: Pasteurized dairy, Cooked meat, PPE for high-risk occupations

#### Pleomorphic Gram Negative Bacteria

##### Acinetobacter baumannii
- **Tests**: Pleomorphic (GNR, GNC, or GNCB), Non-lactose-fermenting, Oxidase negative, Nonmotile
- **Colonization**: Environment (water, soil), Hospitals (ventilation, catheters), Human skin/wounds/respiratory/GI
- **Transmission**: Person-to-person (healthcare workers), Contaminated surfaces/fomites
- **Virulence**: Biofilm, Desiccation resistance, Outer membrane proteins, Efflux pumps
- **Clinical**: Healthcare-associated infections (ventilator pneumonia, bacteremia, UTI, wounds, meningitis)
- **Risk**: ICU admission, Surgery, Catheterization, Antibiotic exposure
- **Management**: Antibiotics (often MDR, may need carbapenems/colistin)
- **Prevention**: Environmental cleaning, Standard and contact precautions (MDR)

### Classification by Other Characteristics

#### Spirochaetes

##### Leptospira interrogans
- **Tests**: Spiral-shaped, Not visible on Gram stain, Darkfield microscopy
- **Colonization**: Zoonotic (rodents, cattle, sheep, goats)
- **Transmission**: Urine from infected animals, Contaminated water/soil, Entry via cuts/mucosa/conjunctivae
- **Virulence**: Outer membrane proteins, Adhesins, Hemolysins, LPS
- **Clinical**: Leptospirosis, Asymptomatic/subclinical, Self-limited, Severe multiorgan failure, Fever, rigors, myalgias, headache, Conjunctival suffusion (characteristic)
- **Risk**: Farmers, Sewer workers, Veterinarians, Jungle trekking, Swimming/kayaking in endemic areas
- **Management**: Penicillin, Doxycycline, Supportive care
- **Prevention**: Eliminate animal contact, Avoid contaminated water, Protective clothing/footwear

##### Treponema pallidum
- **Clinical**: Syphilis

##### Borrelia burgdorferi
- **Clinical**: Lyme disease

#### Bacteria That Cannot Be Gram Stained

##### Chlamydia species
- **Clinical**: Community-acquired pneumonia (C. pneumoniae), Psittacosis (C. psittaci), Urethritis/Trachoma (C. trachomatis)

##### Mycoplasma pneumoniae
- **Clinical**: Community-acquired pneumonia

##### Legionella pneumophila
- **Clinical**: Legionnaires' disease (pneumonia)

##### Rickettsia prowazekii
- **Clinical**: Epidemic typhus (zoonotic)

##### Orientia tsutsugamushi
- **Clinical**: Scrub typhus (zoonotic)

##### Coxiella burnetii
- **Clinical**: Q fever (zoonotic)

## Fungi

### Classification by Morphology

#### Yeasts (Unicellular)
- Single cells, spherical to ellipsoid (3-15 μm)
- Reproduce by budding
- Soft, opaque, cream-colored colonies (1-3mm)
- Gram positive cocci appearance
- **Identification**: Grow at 30/37°C, SDA, Germ-tube test, Biochemical tests, MALDI-TOF, ITS sequencing

#### Molds (Multicellular Filamentous)
- Thread-like filaments (hyphae)
- Interweave to form mycelium
- **Identification**: Colonial morphology, Microscopic examination, MALDI-TOF

#### Dimorphic Fungi
- Yeast in tissue, Hyphal at room temperature
- Examples: Sporothrix, Blastomyces, Coccidioides, Histoplasma, Paracoccidioides, Talaromyces

### Classification by Clinical Type

#### Superficial Mycoses

##### Malassezia furfur
- **Specimen**: Skin scrapings
- **Tests**: KOH preparation (spaghetti and meatballs), SDA with olive oil
- **Colonization**: Skin (normal flora)
- **Transmission**: Direct contact, Endogenous
- **Virulence**: Lipase, Phospholipase, Melanin inhibition
- **Clinical**: Pityriasis versicolor (hypopigmented lesions, itching, scaling), Seborrheic dermatitis, Dandruff
- **Risk**: Hot humid climate, Oily skin, Immunosuppression
- **Management**: Azole creams, Selenium sulfide, Ketoconazole topical/oral
- **Prevention**: Good hygiene, Keep skin dry

##### Exophiala werneckii
- **Clinical**: Tinea nigra (dark discoloration on palm)
- **Management**: Topical azoles, Keratolytic agents

##### Trichosporon beigelii
- **Clinical**: White piedra (soft yellowish nodules on hair)
- **Management**: Shaving, Topical azoles

##### Piedraia hortae
- **Clinical**: Black piedra (hard dark nodules on hair)
- **Management**: Shaving, Topical azoles

#### Cutaneous Mycoses

##### Dermatophytes - Microsporum species
- **Specimen**: Hair, skin scrapings
- **Tests**: Spindle-shaped macroconidia, Golden yellow reverse on SDA, Wood's lamp fluorescence (silvery)
- **Transmission**: Anthropophilic, Zoophilic (dogs, cats), Geophilic (soil)
- **Virulence**: Keratinase, Protease, Ectothrix invasion (outside hair)
- **Clinical**: Tinea capitis (head), Tinea corporis (body), Ringworm (raised red circular lesions)
- **Risk**: Animal contact, Skin abrasion
- **Management**: Topical/oral azoles, Terbinafine, Griseofulvin
- **Prevention**: Avoid infected animals, Good hygiene, Keep dry

##### Dermatophytes - Trichophyton species
- **Specimen**: Hair, skin, nail scrapings
- **Tests**: Pencil-shaped macroconidia, SDA culture
- **Transmission**: Anthropophilic, Zoophilic (cattle, horses), Geophilic
- **Virulence**: Keratinase, Protease, Endothrix (inside hair), Ectothrix
- **Clinical**: Tinea pedis (athlete's foot), Tinea unguium (onychomycosis), Tinea cruris (jock itch), Tinea barbae, Tinea capitis, Tinea corporis
- **Risk**: Occlusive footwear, Communal bathing, Contact with infected
- **Management**: Topical/oral azoles, Terbinafine, Griseofulvin
- **Prevention**: Keep feet dry, Avoid sharing towels/shoes

##### Dermatophytes - Epidermophyton floccosum
- **Specimen**: Skin, nail scrapings
- **Tests**: Club-shaped macroconidia, No microconidia
- **Transmission**: Anthropophilic
- **Virulence**: Keratinase, Protease
- **Clinical**: Tinea cruris, Tinea pedis, Tinea corporis (Does NOT infect hair)
- **Risk**: Warm moist environments, Occlusive clothing
- **Management**: Topical/oral azoles, Terbinafine
- **Prevention**: Keep dry, Avoid tight clothing

##### Candida species
- **Specimen**: Skin, nail scrapings, vaginal swab
- **Tests**: Germ tube positive (C. albicans), Pseudohyphae, Gram positive budding yeast
- **Colonization**: Skin, mucous membranes, GI, vagina (normal flora)
- **Transmission**: Endogenous, Direct contact
- **Virulence**: Adherence (adhesins), Hyphal formation, Biofilm, Proteinases, Phospholipases, Candidalysin
- **Clinical**: Cutaneous candidiasis, Oral thrush, Vaginal candidiasis, Diaper rash, Intertrigo
- **Risk**: Immunosuppression, Diabetes, Antibiotics, Steroids, Pregnancy, Moisture
- **Management**: Topical/oral azoles, Nystatin
- **Prevention**: Good hygiene, Keep dry, Control diabetes

#### Subcutaneous Mycoses

##### Sporothrix schenckii
- **Specimen**: Tissue biopsy, aspirate
- **Tests**: Thermal dimorphism (yeast 37°C cigar-shaped, mold 25°C flower arrangement)
- **Colonization**: Environment (soil, plants)
- **Transmission**: Traumatic inoculation (thorns, wood splinters)
- **Virulence**: Thermal dimorphism, Melanin, Adhesins
- **Clinical**: Sporotrichosis, Multiple nodular lesions along lymphatics, Ulceration, Lymphocutaneous pattern
- **Risk**: Agricultural workers, Forest rangers, Horticulturists, Florists, Gardening
- **Management**: Itraconazole, Amphotericin B, Potassium iodide
- **Prevention**: Protective clothing, Minimize inoculation

##### Fonsecaea pedrosoi, Cladosporium carrionii, Phialophora verrucosa
- **Specimen**: Tissue biopsy
- **Tests**: Dematiaceous fungi, Muriform/sclerotic bodies (brown, 4-12 μm)
- **Colonization**: Environment (soil, decaying vegetation)
- **Transmission**: Traumatic inoculation
- **Virulence**: Melanin, Granuloma formation
- **Clinical**: Chromoblastomycosis, Slow-growing verrucous lesions, Hyperplasia, Lower extremities
- **Risk**: Barefoot agricultural workers, Tropical regions
- **Management**: Surgical excision, Itraconazole, Terbinafine, Amphotericin B
- **Prevention**: Protective footwear

##### Madurella mycetomatis, Pseudallescheria boydii, Exophiala jeanselmei
- **Specimen**: Tissue biopsy, discharge
- **Tests**: Granules (white, brown, black), Splendore-Hoeppli reaction
- **Colonization**: Environment (soil)
- **Transmission**: Traumatic inoculation
- **Virulence**: Granule formation, Chronic inflammation
- **Clinical**: Mycetoma (Madura foot), Swelling, Abscesses, Draining sinuses with granules
- **Risk**: Barefoot individuals, Impoverished populations, Agricultural workers, Tropical regions
- **Management**: Surgical debridement, Antifungals (varies)
- **Prevention**: Protective footwear, Wound care

#### Endemic/Systemic Mycoses

##### Blastomyces dermatitidis
- **Specimen**: Sputum, tissue biopsy
- **Tests**: Thermal dimorphism (broad-based budding yeast 37°C, mold 25°C), GMS/PAS staining
- **Colonization**: Environment (soil) in endemic areas
- **Transmission**: Inhalation of conidia
- **Virulence**: Thermal dimorphism, BAD1 adhesin, TNF-α inhibition
- **Clinical**: Blastomycosis, Pulmonary infection, Cutaneous lesions, Bone/joint involvement, CNS involvement, Fever, cough, night sweats, weight loss
- **Risk**: Endemic regions (Mississippi, Ohio River basins), Outdoor activities, Immunosuppression
- **Management**: Amphotericin B, Itraconazole
- **Prevention**: Avoid high-risk areas during outbreaks

##### Coccidioides immitis/posadasii
- **Specimen**: Sputum, tissue biopsy, CSF
- **Tests**: Spherules with endospores in tissue, Arthroconidia in culture (BSL-3), Yellow TCBS colonies
- **Colonization**: Alkaline soil in semiarid regions
- **Transmission**: Inhalation of arthroconidia
- **Virulence**: Spherule formation (resists phagocytosis), Endospore production
- **Clinical**: Coccidioidomycosis (Valley fever), Pneumonia, Meningitis, Osteomyelitis, Skin granulomas, Flu-like illness
- **Risk**: Endemic areas (SW USA, California, Arizona), Dust storms, Immunocompromised, Pregnancy, Age ≥60
- **Management**: Fluconazole, Amphotericin B (severe)
- **Prevention**: Avoid dust in endemic areas, Mask during dust storms

##### Histoplasma capsulatum
- **Specimen**: Sputum, tissue biopsy, bone marrow
- **Tests**: Thermal dimorphism (small budding yeast 2-4 μm inside macrophages 37°C, tuberculate macroconidia 25°C, BSL-3)
- **Colonization**: Soil contaminated with bat/bird droppings
- **Transmission**: Inhalation of microconidia
- **Virulence**: Thermal dimorphism, Intracellular survival in macrophages, Calcium-binding protein
- **Clinical**: Histoplasmosis (Ohio Valley fever), Pulmonary granulomas, Disseminated disease, Hepatosplenomegaly
- **Risk**: Endemic areas (Ohio, Mississippi valleys), Cave exploration, Cleaning bird roosts, Immunocompromised
- **Management**: Itraconazole, Amphotericin B (severe)
- **Prevention**: Avoid high-risk environments, Respiratory protection

##### Paracoccidioides brasiliensis
- **Specimen**: Sputum, tissue biopsy
- **Tests**: Thermal dimorphism (multiple budding yeast pilot's wheel 37°C, mold 25°C)
- **Colonization**: Soil (armadillo burrows)
- **Transmission**: Inhalation of conidia
- **Virulence**: Thermal dimorphism, Gp43 adhesin, Estrogen-binding protein (males more susceptible)
- **Clinical**: Paracoccidioidomycosis, Pulmonary lesions, Oral/throat lesions, Lymphadenopathy, Hepatosplenomegaly, Weight loss
- **Risk**: Endemic areas (Central/South America, Brazil), Male gender, Rural areas, Agricultural workers
- **Management**: Itraconazole, Amphotericin B
- **Prevention**: Avoid high-risk environments

##### Talaromyces (Penicillium) marneffei
- **Specimen**: Blood, tissue biopsy
- **Tests**: Thermal dimorphism (yeast with central septation 37°C, mold with red pigment 25°C)
- **Colonization**: Environment, Bamboo rats (reservoir)
- **Transmission**: Inhalation
- **Virulence**: Thermal dimorphism, Intracellular survival
- **Clinical**: Disseminated infection in HIV, Fever, anemia, weight loss, Skin lesions, Hepatosplenomegaly
- **Risk**: Southeast Asia (Indochina), HIV/AIDS, Immunosuppression
- **Management**: Amphotericin B followed by itraconazole
- **Prevention**: Avoid bamboo rats, HAART for HIV

#### Opportunistic Mycoses

##### Candida albicans
- **Specimen**: Blood, CSF, urine, oral swab, vaginal swab, tissue
- **Tests**: Germ tube positive, Pseudohyphae in tissue, Gram positive budding yeast, Pink SDA colonies
- **Colonization**: Skin, oral, GI, vagina (40-80% healthy individuals)
- **Transmission**: Endogenous overgrowth, Direct contact
- **Virulence**: Adherence, Hyphal formation (reverse dimorphism), Biofilm, Proteinases, Phospholipases, Candidalysin
- **Clinical**: Oral thrush (pseudomembranous candidiasis), Vaginal candidiasis, Esophagitis, Candidemia, Disseminated candidiasis, Endocarditis, Endophthalmitis
- **Risk**: Immunosuppression, HIV/AIDS, Diabetes, Antibiotics, Steroids, Indwelling catheters, Prolonged hospitalization, Cancer, Transplantation
- **Management**: Fluconazole, Echinocandins (caspofungin), Amphotericin B, Remove catheters
- **Prevention**: HAART for HIV, Control diabetes, Minimize antibiotics, Catheter care

##### Candida auris
- **Specimen**: Blood, wound, ear
- **Tests**: Germ tube negative, MALDI-TOF/PCR required, Cream SDA colonies
- **Colonization**: Skin, healthcare environment
- **Transmission**: Healthcare-associated, Contaminated surfaces
- **Virulence**: Biofilm, Multidrug resistance, Environmental persistence
- **Clinical**: Candidemia, Wound infections, Ear infections, Healthcare outbreaks
- **Risk**: Hospitalization, ICU, Indwelling devices, Surgery, Diabetes, Immunosuppression
- **Management**: Echinocandins (often azole-resistant), Amphotericin B
- **Prevention**: Strict infection control, Environmental cleaning, Contact precautions, Screening

##### Cryptococcus neoformans/gattii
- **Specimen**: CSF, blood, tissue
- **Tests**: India ink (capsule halo), Urease positive, Brown colonies on Niger seed, Cryptococcal antigen test
- **Colonization**: Environment (soil, bird droppings, eucalyptus trees)

- **Virulence**: Polysaccharide capsule (antiphagocytic), Melanin, Urease, Phospholipase
- **Clinical**: Cryptococcal meningitis/meningoencephalitis, Pulmonary cryptococcosis, Cutaneous lesions, Budding yeast with wide capsule in CSF
- **Risk**: HIV/AIDS (CD4 <100), Organ transplantation, Corticosteroids, Malignancy, C. gattii can infect immunocompetent
- **Management**: Amphotericin B plus flucytosine (induction), Fluconazole (consolidation/maintenance)
- **Prevention**: HAART for HIV, Cryptococcal antigen screening, Fluconazole prophylaxis

##### Aspergillus species
- **Specimen**: Sputum, BAL, tissue biopsy

- **Specimen**: Tissue biopsy

### Antifungal Agents

#### Polyenes
- **Mechanism**: Bind ergosterol, disrupt membrane
- **Agents**: Amphotericin B (IV), Nystatin (topical)
- **Pathogens**: Candida, Cryptococcus, Aspergillus, Zygomycetes, Endemic mycoses

#### Allylamines
- **Mechanism**: Block ergosterol synthesis
- **Agents**: Terbinafine (topical, oral)
- **Pathogens**: Dermatophytes

#### Azoles
- **Mechanism**: Block ergosterol synthesis
- **Agents**: Ketoconazole (oral), Itraconazole (IV, oral), Fluconazole (IV, oral), Voriconazole (IV, oral)
- **Pathogens**: Endemic mycoses, Aspergillus, Candida, Cryptococcus, Dermatophytes

#### Echinocandins
- **Mechanism**: Inhibit cell wall synthesis
- **Agents**: Caspofungin (IV)
- **Pathogens**: Candida, Aspergillus

#### Pyrimidine Inhibitor
- **Mechanism**: Inhibits DNA and protein synthesis
- **Agents**: Flucytosine (oral)
- **Pathogens**: Cryptococcus, Candida

### Virus Structure and Properties

#### Envelope Status

##### Enveloped Viruses
- More susceptible to inactivation (pH, bile, detergents, alcohol, drying)
- Released by budding
- Spread in large droplets, secretions, organ transplants, blood
- Must stay wet, Cannot survive in GI tract
- Examples: Herpesviruses, Poxviruses, Hepadnaviruses, Flaviviruses, Togaviruses, Coronaviruses, Orthomyxoviruses, Paramyxoviruses, Rhabdoviruses, Filoviruses, Retroviruses

##### Non-enveloped Viruses
- Environmentally stable to temperature, acid, proteases, detergents, drying
- Released by lysis
- Can spread by fomites, hand-to-hand, dust, small droplets
- Can dry out and retain infectivity, Can survive GI tract
- Examples: Adenoviridae, Papillomaviridae, Polyomaviridae, Parvoviridae, Picornaviridae, Caliciviridae, Reoviridae

#### Capsid Symmetry

##### Helical
- RNA viruses: Rabies, Coronavirus, Measles, Ebola
- Helical nucleocapsids always enveloped for human viruses

##### Icosahedral
- All DNA viruses (except poxviruses) and some RNA viruses
- Examples: Poliovirus, Herpesvirus

##### Complex
- Neither helical nor icosahedral
- Examples: Bacteriophage, Poxvirus

### Viral Latency and Cancer

#### Latent Infections
- HSV-1/2: Neurons (dorsal root ganglia)
- VZV: Neurons
- EBV: B cells
- HBV/HCV: Hepatocytes
- HPV: Epithelial cells
- HIV: T-cells, macrophages

#### Cancer-Associated Viruses
- EBV: Nasopharyngeal carcinoma, Burkitt's lymphoma, Hodgkin's lymphoma
- HBV/HCV: Hepatocellular carcinoma
- HPV: Cervical cancer, Oropharyngeal cancer
- HIV: Kaposi sarcoma (via HHV-8)

### Genetic Variation

#### Antigenic Drift
- Point mutations in RNA viruses
- Example: Influenza

#### Antigenic Shift
- Reassortment of segmented RNA viruses
- Example: Influenza (new pandemic strains)

#### Recombination
- DNA viruses (e.g. Herpesviruses)

## Protozoa

### Classification by Locomotion

#### Amoebae (Pseudopodia)

##### Entamoeba histolytica
- **Tests**: Microscopy (trophozoites with ingested RBCs, 4-nucleated cysts), Antigen detection, PCR
- **Colonization**: Large intestine (colon)
- **Transmission**: Fecal-oral, Contaminated food/water, Person-to-person
- **Virulence**: Cysteine proteinase, Amoebapore, Lectin (adherence), Tissue invasion
- **Clinical**: Amoebic dysentery (bloody diarrhea), Amoebic liver abscess (ALA), Colonic ulcers, Amoeboma, Peritonitis
- **Risk**: Poor sanitation, Crowded living, Male homosexuals, Institutionalized groups
- **Management**: Metronidazole/tinidazole plus intraluminal agent (paromomycin, iodoquinol)
- **Prevention**: Boil water, Hand hygiene, Safe food handling, Proper sewage disposal

##### Naegleria fowleri (Free-living amoeba)
- **Tests**: Microscopy (trophozoites in CSF), Culture at 37°C, PCR
- **Colonization**: CNS (meninges, brain)
- **Transmission**: Swimming in warm freshwater, Nasal insufflation
- **Virulence**: Cytopathic effect, Phagocytosis, Contact-dependent cytolysis
- **Clinical**: Primary amoebic meningoencephalitis (PAM), Fulminant meningitis, Death in 3-7 days, >95% mortality
- **Risk**: Swimming in warm freshwater (lakes, hot springs), Nasal exposure
- **Management**: Amphotericin B plus miltefosine (limited success)
- **Prevention**: Avoid warm freshwater, Don't submerge head, Nose clips

##### Acanthamoeba species (Free-living amoeba)
- **Tests**: Microscopy (trophozoites/cysts in tissue), Culture, PCR
- **Colonization**: CNS, Eye (cornea)
- **Transmission**: Contact lens contamination, Soil/water exposure
- **Virulence**: Cytopathic effect, Protease, Immune evasion
- **Clinical**: Granulomatous amoebic encephalitis (GAE), Amoebic keratitis
- **Risk**: Immunocompromised (GAE), Contact lens wearers (keratitis)

- **Colonization**: RBCs
- **Transmission**: Ixodid tick (Ixodes) bite, Blood transfusion
- **Virulence**: RBC invasion, Hemolysis, Immune evasion
- **Clinical**: Babesiosis, Hemolytic anemia, Fever, Flu-like, Severe in asplenic/immunocompromised
- **Risk**: Northeast/Midwest USA, Tick exposure, Asplenia, Immunosuppression, Elderly
- **Management**: Atovaquone plus azithromycin, Exchange transfusion (severe)
- **Prevention**: Tick avoidance, Protective clothing, Defer blood donation

##### Blood - Toxoplasma gondii
- **Tests**: Serology (IgM/IgG), PCR, Microscopy (tachyzoites, bradyzoites)
- **Colonization**: CNS, Eye, Muscle, Lymph nodes
- **Transmission**: Oocysts (cat feces), Undercooked meat, Vertical
- **Virulence**: Intracellular survival, Tissue cyst formation
- **Clinical**: Toxoplasmosis, Usually asymptomatic, Lymphadenitis, Congenital TORCH syndrome, Encephalitis (HIV), Chorioretinitis
- **Risk**: Immunocompromised (HIV, transplant), Pregnancy, Cat ownership, Undercooked meat
- **Management**: Pyrimethamine plus sulfadiazine plus folinic acid, Spiramycin (pregnancy)
- **Prevention**: Cook meat thoroughly, Avoid cat litter, Hand hygiene, Screen in pregnancy

#### Microsporidia

##### Enterocytozoon bieneusi, Encephalitozoon intestinalis
- **Tests**: Microscopy (Gram-chromotrope stain, spores 1-3 μm), PCR, TEM
- **Colonization**: Small intestine (also systemic for E. intestinalis)
- **Transmission**: Fecal-oral, Inhalation, Contaminated water
- **Virulence**: Obligate intracellular, Polar tubule injection
- **Clinical**: Microsporidiosis, Watery diarrhea, Wasting syndrome, Cholangitis, Disseminated disease
- **Risk**: HIV/AIDS, Immunosuppression, Organ transplantation
- **Management**: Albendazole (E. intestinalis), Fumagillin (E. bieneusi), HAART
- **Prevention**: Safe water, HAART, Hand hygiene

## Prions

### Definition
- Small proteinaceous infectious particles
- Resistant to procedures that modify nucleic acids
- No nucleic acid content
- Caused by misfolded proteins

### Prion Protein (PrP)
- **Normal**: PrPC (cellular prion protein, α-helix rich)
- **Abnormal**: PrPSc (scrapie form, β-sheet rich)
- Conformational transition from α-helix to β-sheet
- Forms aggregates and amyloid fibrils
- Creates sponge-like lesions in brain

### Human Prion Diseases

#### Creutzfeldt-Jakob Disease (CJD)

##### Sporadic CJD
- Most common form
- Median age: 68 years, Duration: 4-5 months
- Clinical: Dementia, early neurologic signs
- Diagnostic: Periodic sharp waves on EEG, 14-3-3 protein in CSF, MRI abnormalities

##### Variant CJD (vCJD)
- Linked to BSE (mad cow disease)
- Median age: 28 years, Duration: 13-14 months
- Clinical: Psychiatric/behavioral symptoms, painful dysesthesias
- Diagnostic: Pulvinar sign on MRI, florid plaques
- Transmission: BSE-contaminated beef

##### Familial CJD
- Associated with PrP gene mutations

##### Iatrogenic CJD
- Transmission via contaminated surgical instruments, dura mater grafts, pituitary hormones

#### Fatal Familial Insomnia
- Inherited prion disease
- Progressive insomnia and autonomic dysfunction

#### Gerstmann-Sträussler-Scheinker Syndrome (GSS)
- Inherited prion disease
- Progressive ataxia and dementia

#### Kuru
- Transmitted through ritualistic cannibalism
- Historical disease in Papua New Guinea

### Animal Prion Diseases
- Bovine Spongiform Encephalopathy (BSE) - Mad cow disease
- Scrapie - Sheep and goats
- Chronic Wasting Disease - Deer and elk

### Infection Control
- Stringent chemical and autoclave sterilization required
- Prions resistant to standard disinfection
- Special protocols for high-infectivity tissues
- No effective treatment, only supportive care

## Laboratory Diagnosis

### Specimen Collection
- Timing is crucial
- Proper transport and storage
- Type depends on suspected infection

### Direct Examination
- Microscopy (light, fluorescence, electron)
- Staining methods (Gram, acid-fast, KOH, India ink, GMS, PAS)

### Culture
- Bacteria: Various agars, anaerobic/aerobic conditions
- Fungi: SDA, specialized media, temperature requirements
- Viruses: Cell culture, embryonated eggs
- Protozoa: Specialized media

### Antigen Detection
- Immunofluorescence
- Enzyme immunoassay (EIA/ELISA)
- Lateral flow assays
- Immunochromatography

### Antibody Detection (Serology)
- Acute vs convalescent titers
- IgM (acute) vs IgG (past/immunity)

### Molecular Methods
- PCR and derivatives
- Sequencing
- MALDI-TOF mass spectrometry

### Antimicrobial Susceptibility Testing
- Determines effective treatment
- Identifies resistance patterns

## Infection Prevention and Control

### Chain of Infection
- Infectious agent
- Reservoir
- Portal of exit
- Mode of transmission
- Portal of entry
- Susceptible host

### Breaking the Chain
- Eliminate/control reservoir
- Block transmission (hand hygiene, PPE, isolation)
- Protect susceptible host (vaccination, prophylaxis)

### Standard Precautions
- Hand hygiene
- PPE (gloves, gowns, masks, eye protection)
- Safe injection practices
- Respiratory hygiene/cough etiquette

### Transmission-Based Precautions
- Contact precautions (MDR bacteria, C. difficile)
- Droplet precautions (N. meningitidis, influenza)
- Airborne precautions (tuberculosis, measles, varicella)

### Antimicrobial Stewardship
- Appropriate antibiotic selection
- Optimal dosing and duration
- Minimize resistance development
- Reduce adverse effects
